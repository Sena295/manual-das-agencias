function aviso(txt,ms){ const t=document.getElementById('toast'); t.textContent=txt; clearTimeout(aviso.tm); aviso.tm=setTimeout(()=>t.textContent='',ms||4500); }

/* Perguntas S/N do robô, uma vez por arquivo. Formatação já vem como Sim; as demais o usuário decide. */
const PERGUNTAS_TELA = {formatacao:'1. Arrumar formatações das colunas?',bilhete:'2. Arrumar bilhetes errados?',cnpj:'3. Arrumar CAMPO_15?',
  campo19:'4. Arrumar CAMPO 19 errados?',classe:'5. Preencher classes vazias com P?',remover_extras:'Remover colunas extras?',
  remover_emd:'Remover bilhetes EMD?',remover_duplicadas:'Remover duplicadas?',remover_invalidos:'Remover linhas com campos vazios ou inválidos?'};
function perguntasDe(arquivo){
  const p = TR.previas[arquivo];
  const ops = (API.status?.opcoes||D.opcoes||[])
    .filter(o=>(o.id!=='classe' || (p && p.classesVazias)) && (o.tipo!=='extras' || (p && (p.extras||[]).length)))
    .map(o=>({...o, tipo:o.tipo||'correcao', pergunta: PERGUNTAS_TELA[o.id]||o.pergunta}));
  return [{id:'arrumar',pergunta:'Quer arrumar a base?',rotulo:'Liga as correções de 1 a 5',tipo:'arrumar'}, ...ops];
}
function respostasDe(arquivo){
  if(!TR.resp[arquivo]) TR.resp[arquivo] = {arrumar:'S', formatacao:'S'};
  return TR.resp[arquivo];
}
function pendentes(arquivo){
  const r = respostasDe(arquivo);
  if(!TR.previas[arquivo]) return ['analisar'];
  // com "Quer arrumar a base?" = Não, as correções ficam desligadas; extras e remoções continuam valendo
  const falta = perguntasDe(arquivo).filter(q=>!(r.arrumar==='N' && q.tipo==='correcao') && !r[q.id]).map(q=>q.id);
  if((TR.previas[arquivo].nome||[]).length && !r.nome_ok) falta.unshift('nome_ok');
  return falta;
}
function opcoesDe(arquivo){
  const r = respostasDe(arquivo), liga = r.arrumar==='S';
  return Object.fromEntries((API.status?.opcoes||D.opcoes||[]).map(o=>[o.id, (o.tipo||'correcao')==='correcao' ? liga && r[o.id]==='S' : r[o.id]==='S']));
}
function responder(arquivo,id,valor){ respostasDe(arquivo)[id]=valor; delete TR.simul[arquivo]; renderTratar(); }
async function analisar(arquivo){
  TR.foco = arquivo;
  if(TR.previas[arquivo]||TR.carregando[arquivo]){ renderTratar(); return; }
  TR.carregando[arquivo]=true; TR.erro[arquivo]=null; renderTratar();
  try{ TR.previas[arquivo] = await api('/api/previa',{arquivo}); }
  catch(err){ TR.erro[arquivo]=err.message; }
  TR.carregando[arquivo]=false; renderTratar();
}
async function simular(arquivo){
  TR.simul[arquivo]={carregando:true}; renderTratar();
  try{ TR.simul[arquivo] = await api('/api/simular',{arquivo,opcoes:opcoesDe(arquivo)}); }
  catch(err){ TR.simul[arquivo]={erro:err.message}; }
  renderTratar();
}
function alternarSel(arquivo,v){
  v?TR.sel.add(arquivo):TR.sel.delete(arquivo);
  if(v) analisar(arquivo); else renderTratar();
}
async function rodar(){
  const falta = [...TR.sel].filter(a=>pendentes(a).length);
  if(falta.length){ aviso(`Responda as perguntas de: ${falta.join(', ')}`); analisar(falta[0]); return; }
  const pulados = [...TR.sel].filter(a=>respostasDe(a).nome_ok==='N');
  const itens = [...TR.sel].filter(a=>!pulados.includes(a)).map(arquivo=>({arquivo,opcoes:opcoesDe(arquivo)}));
  if(pulados.length) aviso(`Não será tratado (nome fora do padrão): ${pulados.join(', ')}. Corrija o nome e salve de novo no Dark Clouds.`, 12000);
  if(!itens.length) return;
  try{ API.status.job = await api('/api/rodar',{itens}); acompanharJob(); renderTratar(); }
  catch(err){ aviso(err.message); }
}
function acompanharJob(){
  clearInterval(TR.timer);
  TR.timer = setInterval(async()=>{
    try{
      const job = await api('/api/job'); API.status.job = job;
      if(aba==='tratar') renderTratar();
      if(job.estado!=='rodando'){
        clearInterval(TR.timer); TR.timer=null;
        if(job.estado==='concluido'){
          try{ sessionStorage.setItem('agencias-pos-execucao',JSON.stringify(job.resultados||[])); }catch(_){}
          setTimeout(()=>location.reload(),2200);
        }
      }
    }catch(_){}
  },1000);
}
async function alternarAutostart(v){
  try{ const j = await api('/api/autostart',{ativar:v}); API.status.autostart=j.autostart; aviso(j.autostart?'O servidor vai iniciar junto com o Windows.':'Inicialização automática desligada.'); }
  catch(err){ aviso(err.message); }
  renderTratar();
}

function blocoPrevia(arquivo){
  if(TR.carregando[arquivo]) return `<div class="box"><div class="carregando"><span class="giro"></span>Lendo a base crua e testando as correções. Bases grandes podem levar alguns segundos.</div></div>`;
  if(TR.erro[arquivo]) return `<div class="aviso erro">${esc(TR.erro[arquivo])}</div>`;
  const p = TR.previas[arquivo];
  if(!p) return `<div class="box"><h3>Escolha um arquivo</h3><div class="sub">Clique no nome de um arquivo à esquerda para ler a base crua e responder as perguntas de correção.</div></div>`;
  if(p.rejeitado) return `<div class="aviso erro"><b>O arquivo será rejeitado.</b> ${esc(p.motivo)}</div>`;
  const e = p.estudo, n = e.linhas||1, r = respostasDe(arquivo);
  const errCru = (n-e.antes.linhas)/n*100, errPot = (n-e.potencial.linhas)/n*100;
  const sim = TR.simul[arquivo];
  const qs = perguntasDe(arquivo).map(q=>{
    const im = e.impacto?.[q.id]||{}, desab = q.tipo==='correcao' && r.arrumar==='N';
    const afetadas = e.linhasPorPergunta?.[q.id];
    const nome = `q-${q.id}`;
    return `<fieldset class="pergunta${desab?' off':''}"${desab?' disabled':''}><legend>${esc(q.pergunta)}<small>${esc(q.rotulo||'')}${q.id==='classe'?` · ${fmtInt(p.classesVazias)} células vazias`:''}</small></legend>
      ${q.tipo==='correcao'?`<span class="imp">${im.linhas?`<b>+${fmtInt(im.linhas)} linha${im.linhas===1?'':'s'}</b> ${brl(im.valor)}`:'<span style="color:var(--text2)">nenhuma linha a recuperar</span>'}${im.padroniza?` · padroniza ${fmtInt(im.padroniza)}`:''}</span>`
        : q.tipo==='remocao'?`<span class="imp">${afetadas?`<b style="color:var(--warn)">${fmtInt(afetadas)} linha(s)</b> com esse problema`:'<span style="color:var(--text2)">nenhuma linha com esse problema</span>'}</span>`
        : q.tipo==='extras'?`<span class="imp" style="white-space:normal;max-width:260px">${esc((p.extras||[]).join('; '))}</span>`:''}
      <span class="sn" role="radiogroup">${['S','N'].map(v=>`<label class="${r[q.id]===v?'on':''}"><input type="radio" name="${nome}" value="${v}" ${r[q.id]===v?'checked':''} onchange="responder(${js(arquivo)},'${q.id}','${v}')">${v==='S'?'Sim':'Não'}</label>`).join('')}</span></fieldset>`;
  }).join('');
  const falta = pendentes(arquivo).length;
  let resSim = '';
  if(sim?.carregando) resSim = '<div class="carregando"><span class="giro"></span>Simulando…</div>';
  else if(sim?.erro) resSim = `<div class="aviso erro">${esc(sim.erro)}</div>`;
  else if(sim?.estudo){ const s=sim.estudo, err=s.linhas?s.removidas.linhas/s.linhas*100:0;
    resSim = `<div class="aviso ${err>LIM?'erro':'ok'}">Com estas respostas a base ajustada fica com <b>${fmtPct(err,2)} de erro</b>: ${err>LIM?'<b>não sobe</b> no banco':'<b>sobe</b> no banco'}. ${fmtInt(s.depois.linhas)} linhas aprovadas (${brl(s.depois.valor)}), ${fmtInt(s.recuperadas.linhas)} corrigidas e ${fmtInt(s.removidas.linhas)} de fora.</div>`; }
  const crua = Object.entries(Object.assign({},e.errosBrutos||{},Object.fromEntries(Object.entries(e.foraPadrao?.porColuna||{}).map(([k,v])=>[k+' fora do padrão',v])))).sort((a,b)=>b[1]-a[1]);
  const restam = Object.entries(e.errosPotencial||{}).sort((a,b)=>b[1]-a[1]);
  return `<div class="box"><h3>${esc(arquivo)}</h3><div class="sub">${fmtInt(e.linhas)} linhas na base crua${p.bcd?' · regra BCD':''}${(p.nome||[]).length?' · <span class="tag warn">nome fora do padrão</span>':''}${(p.cabecalho||[]).length?' · <span class="tag warn">cabeçalho fora do layout</span>':''}</div>
    <div class="grid g3">${tile('Situação Base Crua',`${fmtPct(errCru)}<small> de erro</small>`,`${chipSobe(errCru<=LIM)} como chegou · ${linhasTxt(n-e.antes.linhas)} precisam de ajuste`,'',errCru>LIM?'warn':'ok')}
    ${tile('Com todas as correções',`${fmtPct(errPot)}<small> de erro</small>`,`${chipSobe(errPot<=LIM)} ${linhasTxt(n-e.potencial.linhas)} ficam de fora · ${brl(e.potencial.valor)} aprovados`,'',errPot>LIM?'warn':'ok')}
    ${tile('Linhas que dá para corrigir',fmtInt(e.potencial.linhas-e.antes.linhas),'Se todas as correções forem ligadas')}</div>
    ${alertaNome(arquivo,p,r)}
    ${alertaExtras(arquivo,p,r)}
    ${(p.cabecalho||[]).filter(h=>!(p.extras||[]).length || !h.startsWith('Colunas EXTRAS')).length?`<div class="aviso erro" style="margin-top:12px">${p.cabecalho.filter(h=>!(p.extras||[]).length || !h.startsWith('Colunas EXTRAS')).map(esc).join('<br>')}</div>`:''}
    <div class="titulo" style="margin-top:22px"><h2>Perguntas do tratamento</h2><span class="titulo-nota">${falta?`Faltam ${falta} resposta(s)`:'Todas respondidas'} · ao lado, o ganho de cada correção sozinha</span></div>
    <div class="op-lista">${qs}</div>
    <div class="acoes" style="margin-top:14px"><button class="btn-sec" onclick="simular(${js(arquivo)})" ${falta?'disabled':''}>Simular com estas respostas</button></div>
    <div style="margin-top:12px">${resSim}</div>
    <div class="grid g2" style="margin-top:18px"><div><h3 style="font-size:13px;margin-bottom:4px">Erros na base crua · ${linhasTxt(n-e.antes.linhas)}</h3>${crua.length?`<p class="notinha" style="margin-bottom:8px">Contagem por tipo de apontamento: uma mesma linha pode ter vários.</p><table class="tb-mini"><tbody>${crua.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fmtInt(v)}</td></tr>`).join('')}</tbody></table>`:'<p class="notinha">A base chegou sem erros.</p>'}</div>
    <div><h3 style="font-size:13px;margin-bottom:4px">Continuam mesmo com todas as correções · ${linhasTxt(n-e.potencial.linhas)} de fora</h3>${restam.length?`<p class="notinha" style="margin-bottom:8px">Estas linhas não têm correção automática e saem da base. Contagem por tipo de apontamento: uma mesma linha pode ter vários.</p><table class="tb-mini"><tbody>${restam.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fmtInt(v)}</td></tr>`).join('')}</tbody></table>`:'<p class="notinha">Nada: todas as linhas sobem com as correções.</p>'}</div></div>
    <div style="margin-top:18px"><h3 style="font-size:13px;margin-bottom:8px">Valor enviado por companhia</h3>${pilhaCia(D.ordemCia.map(c=>({cia:c,valor:e.porCia[c].bruto.valor,linhas:e.porCia[c].bruto.linhas})),true)}${legendaCia(D.ordemCia.map(c=>({cia:c,valor:e.porCia[c].bruto.valor})))}</div></div>`;
}

function viewTratar(){
  if(D.demo) return `<div class="aviso"><b>Versão de demonstração.</b><br>Nesta página publicada o tratamento não roda: não há servidor nem bases reais. Na instalação interna, esta aba lista os arquivos recebidos, mostra a leitura da base crua e as perguntas de correção, e roda o robô.</div>`;
  if(!API.conectado){
    return `<div class="aviso"><b>O servidor do painel não está ligado neste computador.</b><br>Abra o atalho <code>atalho do painel</code> na pasta <code>Manual das Agências</code>. Ele liga o servidor (só nesta máquina), abre o painel e configura a inicialização com o Windows.</div>
      <div class="acoes" style="margin-top:14px"><button class="btn-pri" onclick="atualizarStatus().then(render)">Tentar conectar de novo</button></div>`;
  }
  const st = API.status, job = st.job||{}, arquivos = (st.dark||[]);
  if(TR.foco && !arquivos.some(a=>a.arquivo===TR.foco)) TR.foco=null;
  [...TR.sel].forEach(a=>{ if(!arquivos.some(x=>x.arquivo===a)) TR.sel.delete(a); });
  let h = '';
  if(st.trava && job.estado!=='rodando') h += `<div class="aviso erro" style="margin-bottom:14px"><b>Tratamento em andamento</b> por ${esc(st.trava.usuario)} em ${esc(st.trava.maquina)} desde ${dataHora(st.trava.inicio)}. Aguarde terminar para rodar.</div>`;
  if(job.estado==='rodando'||job.estado==='concluido'||job.estado==='erro'){
    const res = (job.resultados||[]).map(r=>`<tr><td>${esc(r.arquivo)}</td><td>${r.rejeitado?'<span class="tag warn">Rejeitado</span>':fmtInt(r.aprovados)}</td><td>${r.rejeitado?'–':fmtInt(r.removidos)}</td><td>${r.rejeitado?'–':fmtInt(r.recuperadas)}</td></tr>`).join('');
    h += `<div class="box" style="margin-bottom:18px"><h3>${job.estado==='rodando'?'Tratando…':job.estado==='concluido'?'Tratamento concluído':'O tratamento parou'}</h3>
      <div class="sub">${job.estado==='rodando'?`${esc(job.etapa||'')} ${job.arquivo?'· '+esc(job.arquivo):''} · arquivo ${fmtInt((job.indice||0)+1)} de ${fmtInt(job.total)}`:job.estado==='concluido'?'Recarregando o painel com os valores novos…':esc(job.erro||'')}</div>
      <div class="progresso" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round((job.progresso||0)*100)}"><i style="width:${((job.progresso||0)*100).toFixed(1)}%"></i></div>
      ${res?`<div class="scr" style="max-height:none"><table class="tb-mini"><thead><tr><th>Arquivo</th><th>Aprovadas</th><th>Ficaram de fora</th><th>Corrigidas</th></tr></thead><tbody>${res}</tbody></table></div>`:''}</div>`;
  }
  const bloqueado = job.estado==='rodando' || !!st.trava;
  const falta = [...TR.sel].filter(a=>pendentes(a).length);
  const lista = arquivos.length ? arquivos.map(a=>{const pend = TR.sel.has(a.arquivo) && pendentes(a.arquivo).length;
    return `<div class="tr-item${TR.foco===a.arquivo?' foco':''}">
      <input type="checkbox" aria-label="Selecionar ${esc(a.arquivo)}" ${TR.sel.has(a.arquivo)?'checked':''} ${a.csv&&!bloqueado?'':'disabled'} onchange="alternarSel(${js(a.arquivo)},this.checked)">
      <div><button class="nome" onclick="analisar(${js(a.arquivo)})">${esc(a.arquivo)}</button>
      <div class="meta">${esc(a.agencia)} · ${esc(a.tipo||'–')} · ${fmtDec(a.tamanho/1048576,1)} MB · ${dataHora(a.modificado)}</div>
      <div class="tags">${a.jaTratado?'<span class="tag amb" data-tip="Já existe um tratamento com este nome. Rodar de novo substitui o resultado anterior.">Reenvio</span>':''}${a.csv?'':'<span class="tag warn">Não é .csv</span>'}${a.csv&&(a.nome||[]).length?`<span class="tag warn" data-tip="${esc(a.nome.join(' '))}">Nome fora do padrão</span>`:''}${pend?'<span class="tag warn">Falta responder</span>':TR.sel.has(a.arquivo)?'<span class="tag ok">Pronto para rodar</span>':''}</div></div></div>`;}).join('')
    : '<div class="vazio">Nenhum arquivo aguardando no Dark Clouds.</div>';
  h += `<div class="tr-grid"><div><div class="box" style="padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px"><h3>Dark Clouds (${fmtInt(arquivos.length)})</h3>
      ${arquivos.length?`<button class="btn-limpar" onclick="${TR.sel.size===arquivosCsv().length?'TR.sel.clear();renderTratar()':'arquivosCsv().forEach(a=>alternarSel(a,true))'}" ${bloqueado?'disabled':''}>${TR.sel.size===arquivosCsv().length&&arquivos.length?'Limpar seleção':'Selecionar todos'}</button>`:''}</div>
      <div class="tr-lista">${lista}</div>
      <button class="btn-pri" style="width:100%;justify-content:center;margin-top:14px" onclick="rodar()" ${TR.sel.size&&!bloqueado&&!falta.length?'':'disabled'}>${icon('tratar')}Rodar ${TR.sel.size?TR.sel.size+' arquivo(s)':'selecionados'}</button>
      <p class="notinha">${falta.length?`Responda as perguntas de ${falta.length} arquivo(s) antes de rodar.`:'Cada arquivo roda com as respostas dadas nas perguntas dele.'}</p>
      <div class="acoes" style="margin-top:10px"><button class="btn-sec" onclick="atualizarStatus().then(renderTratar)">Atualizar lista</button><button class="btn-sec" onclick="abrirArquivo('dark','')">Abrir pasta</button></div></div>
      <div class="box" style="padding:16px;margin-top:14px"><h3 style="font-size:13px">Servidor</h3><p class="notinha">${esc(st.usuario)} em ${esc(st.maquina)}<br><span style="overflow-wrap:anywhere">${esc(st.base)}</span></p>
      <label class="op" style="margin-top:10px"><input type="checkbox" ${st.autostart?'checked':''} onchange="alternarAutostart(this.checked)"><span style="font-size:12.5px;font-weight:600">Iniciar com o Windows</span><span></span></label>
      <div class="acoes" style="margin-top:10px"><button class="btn-sec" onclick="recalcular()">Recalcular painel</button><button class="btn-sec" onclick="abrirArquivo('empresas','')">Empresas consolidadas</button></div></div></div>
    <div>${blocoPrevia(TR.foco)}</div></div>`;
  return h;
}
function arquivosCsv(){ return (API.status?.dark||[]).filter(a=>a.csv).map(a=>a.arquivo); }
function renderTratar(){
  if(aba!=='tratar') return;
  const v = document.getElementById('view-tratar'), y = window.scrollY;
  const ativo = document.activeElement?.id;
  v.innerHTML = viewTratar();
  window.scrollTo(0,y);
  if(ativo && document.getElementById(ativo)) document.getElementById(ativo).focus();
  pintarServidor();
}

/* ======================================================================
   8. Filtros, navegação e montagem da tela
   ====================================================================== */

function setFiltro(qual,valor){
  if(qual==='agencia') fAgencia=valor;
  else if(qual==='status') fStatus=valor;
  else if(qual==='cia') fCia=valor;
  else if(qual==='busca') fBusca=valor;
  else if(qual==='periodo') fPeriodo=valor;
  montarFiltros();
  render();
}
/* Sugestões da busca: agências e arquivos que combinam com o texto (sem diferenciar acento e maiúscula).
   Agência: filtra o painel por ela. Arquivo: abre o detalhe do envio. */
const semAcento = t => String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
let SUG = {itens:[], ativo:-1};
function sugerir(){
  const caixa = document.getElementById('sugestoes'), campo = document.getElementById('busca');
  const q = semAcento(campo.value.trim());
  if(!q){ fecharSugestoes(); return; }
  const porAg = new Map();
  D.envios.forEach(e=>{ if(semAcento(e.agencia).includes(q) || semAcento(e.arquivo).includes(q)){ const a=porAg.get(e.agencia)||[]; a.push(e); porAg.set(e.agencia,a); } });
  const ags = [...porAg.entries()].sort((a,b)=>(semAcento(a[0]).startsWith(q)?0:1)-(semAcento(b[0]).startsWith(q)?0:1) || a[0].localeCompare(b[0])).slice(0,5);
  const arqs = [...porAg.values()].flat().sort((a,b)=>(b.dataProc+b.horaProc).localeCompare(a.dataProc+a.horaProc)).slice(0,8);
  SUG = {itens:[...ags.map(([ag,l])=>({tipo:'agencia',ag,l})), ...arqs.map(e=>({tipo:'arquivo',e}))], ativo:-1};
  if(!SUG.itens.length){
    caixa.innerHTML = `<div class="sug-vazio">Nenhuma agência ou arquivo com “${esc(campo.value.trim())}”.</div>`;
  } else {
    const secAg = ags.length ? '<div class="sug-titulo">Agências</div>' : '';
    const secArq = arqs.length ? '<div class="sug-titulo">Arquivos</div>' : '';
    caixa.innerHTML = secAg + SUG.itens.map((it,i)=>(i===ags.length?secArq:'') + (it.tipo==='agencia'
      ? `<button type="button" class="sug-item" role="option" id="sug-${i}" aria-selected="false" onmousedown="event.preventDefault()" onclick="escolherSugestao(${i})">
          <b>${esc(it.ag)}</b><small>${fmtInt(it.l.length)} arquivo(s) · filtrar o painel por esta agência</small></button>`
      : `<button type="button" class="sug-item" role="option" id="sug-${i}" aria-selected="false" onmousedown="event.preventDefault()" onclick="escolherSugestao(${i})">
          <span class="sug-linha"><b>${esc(it.e.arquivo)}</b>${chipFaixa(it.e.faixa)}</span><small>${esc(it.e.agencia)} · tratado em ${dataBR(it.e.dataProc)}${it.e.arquivado?' · no Histórico':''}</small></button>`)).join('');
  }
  const r = campo.closest('.search-field').getBoundingClientRect();
  Object.assign(caixa.style,{left:r.left+'px', top:(r.bottom+6)+'px', width:Math.max(r.width,320)+'px'});
  caixa.hidden = false; campo.setAttribute('aria-expanded','true');
}
function fecharSugestoes(){
  const caixa = document.getElementById('sugestoes'); if(!caixa) return;
  caixa.hidden = true; document.getElementById('busca')?.setAttribute('aria-expanded','false');
  document.getElementById('busca')?.removeAttribute('aria-activedescendant');
}
function escolherSugestao(i){
  const it = SUG.itens[i]; if(!it) return;
  const campo = document.getElementById('busca');
  fecharSugestoes();
  if(it.tipo==='agencia'){ campo.value=''; fBusca=''; setFiltro('agencia', it.ag); }
  else drawerEnvio(it.e.id);
}
function teclaSugestao(ev){
  const caixa = document.getElementById('sugestoes');
  if(ev.key==='Escape'){ if(!caixa.hidden){ ev.stopPropagation(); fecharSugestoes(); } return; }
  if(caixa.hidden || !SUG.itens.length) return;
  if(ev.key==='ArrowDown' || ev.key==='ArrowUp'){
    ev.preventDefault();
    SUG.ativo = (SUG.ativo + (ev.key==='ArrowDown'?1:-1) + SUG.itens.length) % SUG.itens.length;
    caixa.querySelectorAll('.sug-item').forEach((b,i)=>{ b.classList.toggle('on',i===SUG.ativo); b.setAttribute('aria-selected',String(i===SUG.ativo)); });
    document.getElementById('busca').setAttribute('aria-activedescendant','sug-'+SUG.ativo);
    document.getElementById('sug-'+SUG.ativo)?.scrollIntoView({block:'nearest'});
  } else if(ev.key==='Enter' && SUG.ativo>=0){ ev.preventDefault(); escolherSugestao(SUG.ativo); }
}
window.addEventListener('resize', fecharSugestoes);
window.addEventListener('scroll', ()=>{ if(!document.getElementById('sugestoes')?.hidden) sugerir(); }, {passive:true});
function limparFiltros(){
  fAgencia='todos'; fStatus='todos'; fBusca=''; fPeriodo='tudo'; fCia='todas';
  const busca = document.getElementById('busca');
  if(busca) busca.value = '';
  fecharSugestoes();
  montarFiltros();
  render();
}
function irPara(nova){
  aba=nova; render();
  if(nova==='tratar') atualizarStatus().then(renderTratar);
  try{ history.replaceState(null,'','#'+nova); }catch(_){}
  window.scrollTo({top:0});
}
function alternarValores(){
  verValores = !verValores;
  render();
  const dr = document.getElementById('drawer');
  if(!dr.hidden){ if(dr.dataset.envio) drawerEnvio(dr.dataset.envio); else if(dr.dataset.agencia) drawerAgencia(dr.dataset.agencia); }
}
function trocarTema(){
  document.body.classList.toggle('claro');
  preferencia('agencias-tema',document.body.classList.contains('claro')?'claro':'escuro');
  render();
}
// filtros: busca e período; agência, companhia e status entram como etiquetas removíveis quando vêm de um clique
function montarFiltros(){
  document.getElementById('atalhos').innerHTML = ATALHOS.map(([k,r])=>
    `<button aria-pressed="${fPeriodo===k}" class="atalho-item${fPeriodo===k?' on':''}" onclick="setFiltro('periodo','${k}')">${r}</button>`).join('');
  const chips = [];
  if(fAgencia!=='todos') chips.push(['agencia','todos',`Agência: ${fAgencia}`]);
  if(fCia!=='todas') chips.push(['cia','todas',`Companhia: ${NOMES_CIA[fCia]}`]);
  if(fStatus!=='todos') chips.push(['status','todos',STATUS[fStatus]]);
  document.getElementById('chipsFiltro').innerHTML = chips.map(([q,v,t])=>`<button class="chip-filtro" onclick="setFiltro('${q}','${v}')" aria-label="Remover filtro ${esc(t)}">${esc(t)} <span aria-hidden="true">✕</span></button>`).join('');
}

function render(){
  const lista = filtrados();
  const rotulo = k => (ABAS.find(a=>a[0]===k)||[])[1];
  const nHist = D.envios.filter(e=>e.arquivado).length;
  document.getElementById('sideNav').innerHTML = GRUPOS_ABAS.map(([grupo,ks])=>`<p class="side-grupo">${grupo}</p>`+
    ks.map(k=>`<button class="${aba===k?'on':''}" aria-current="${aba===k?'page':'false'}" onclick="irPara('${k}')">${icon(k)}<span>${rotulo(k)}</span>${k==='envios'?`<span class="tab-count">${lista.length}</span>`:k==='historico'&&nHist?`<span class="tab-count">${nHist}</span>`:''}</button>`).join('')).join('');
  document.getElementById('sourceCount').textContent = fmtInt(D.envios.length-nHist)+' arquivo(s) na visão · '+fmtInt(nHist)+' no histórico';
  document.getElementById('btnOlho').setAttribute('aria-pressed',String(verValores));
  document.getElementById('btnTema').setAttribute('aria-pressed',String(document.body.classList.contains('claro')));
  document.getElementById('tituloPagina').textContent = rotulo(aba) || 'Manual das Agências';
  document.getElementById('stamp').textContent = 'Atualizado em ' + D.geradoEm;
  document.getElementById('btnOlho').classList.toggle('on', verValores);
  document.getElementById('btnTema').classList.toggle('on', document.body.classList.contains('claro'));
  document.getElementById('btnTratar').hidden = aba==='tratar';
  document.getElementById('btnLimpar').hidden = aba==='tratar' || aba==='historico';
  document.getElementById('filtros').hidden = SEM_FILTROS.includes(aba);
  document.getElementById('subTxt').textContent = DESCRICAO_ABAS[aba]||'';

  const views = {geral:viewGeral,banco:viewBanco,vendas:viewVendas,agencias:viewAgencias,erros:viewErros,envios:viewEnvios,
    atividade:viewAtividade,historico:viewHistorico,tratar:viewTratar,template:viewTemplate};
  const area = document.getElementById('views');
  ABAS.forEach(([k])=>{
    let el = document.getElementById('view-'+k);
    if(!el){ el = document.createElement('div'); el.className='view'; el.id='view-'+k; area.appendChild(el); }
    el.innerHTML = aba===k ? views[k]() : ''; el.classList.toggle('on', aba===k);
  });
  if(aba==='template') atualizarTemplate();
  pintarServidor();
  document.getElementById('foot').innerHTML = (D.demo
    ? (D.demo.rodape||'') + `<h3 class="aviso-demo">${esc(D.demo.aviso||'Dados fictícios.')}</h3>`
    : '');
}

/* cliques e teclado: abre o detalhe de arquivo/agência a partir de qualquer tabela ou cartão */
document.addEventListener('click',ev=>{
  if(ev.target.closest('.mask,a,input,select,label,fieldset')) return;
  const env = ev.target.closest('[data-envio]'); if(env){ drawerEnvio(env.dataset.envio); return; }
  const ag = ev.target.closest('[data-agencia]'); if(ag){ drawerAgencia(ag.dataset.agencia); }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape') fecharDrawer();
  if((ev.key==='Enter'||ev.key===' ') && ev.target.matches('.mask')){ ev.preventDefault(); alternarValores(); return; }
  if((ev.key==='Enter'||ev.key===' ') && ev.target.matches('tr[data-envio],tr[data-agencia]')){
    ev.preventDefault(); ev.target.dataset.envio ? drawerEnvio(ev.target.dataset.envio) : drawerAgencia(ev.target.dataset.agencia);
  }
  if(ev.key==='Tab' && !document.getElementById('drawer').hidden){
    const f = [...document.getElementById('drawer').querySelectorAll('button,[tabindex="0"]')].filter(x=>!x.disabled);
    if(!f.length) return;
    if(ev.shiftKey && document.activeElement===f[0]){ ev.preventDefault(); f[f.length-1].focus(); }
    else if(!ev.shiftKey && document.activeElement===f[f.length-1]){ ev.preventDefault(); f[0].focus(); }
  }
});
/* dica ao passar o mouse ou focar (data-tip) */
(function(){
  const tip = document.getElementById('tip');
  const mostrar = (el,x,y)=>{ tip.textContent = el.dataset.tip; tip.hidden=false;
    const r = tip.getBoundingClientRect(); tip.style.left = Math.min(window.innerWidth-r.width-8, Math.max(8,x-r.width/2))+'px';
    tip.style.top = (y-r.height-12<8 ? y+18 : y-r.height-12)+'px'; };
  document.addEventListener('mouseover',ev=>{ const el=ev.target.closest('[data-tip]'); if(el) mostrar(el,ev.clientX,ev.clientY); else tip.hidden=true; });
  document.addEventListener('mousemove',ev=>{ const el=ev.target.closest('[data-tip]'); if(el&&!tip.hidden) mostrar(el,ev.clientX,ev.clientY); });
  document.addEventListener('focusin',ev=>{ const el=ev.target.closest('[data-tip]'); if(el){ const r=el.getBoundingClientRect(); mostrar(el,r.left+r.width/2,r.top); } });
  document.addEventListener('focusout',()=>tip.hidden=true);
  window.addEventListener('scroll',()=>tip.hidden=true,{passive:true});
})();

function iniciar(){
  const hash = ABAS_ANTIGAS[(location.hash||'').slice(1)] || (location.hash||'').slice(1);
  if(ABAS.some(a=>a[0]===hash)) aba = hash;
  let pos = null;
  try{ pos = JSON.parse(sessionStorage.getItem('agencias-pos-execucao')||'null'); sessionStorage.removeItem('agencias-pos-execucao'); }catch(_){}
  if(pos){ aba='geral'; try{ history.replaceState(null,'','#geral'); }catch(_){} }
  montarFiltros();
  render();
  if(pos) aviso(`Painel atualizado: ${pos.length} arquivo(s) tratado(s) agora estão em destaque.`);
  const avisosPos = (pos||[]).filter(r=>r.aviso).map(r=>r.aviso)
    .concat((pos||[]).filter(r=>(r.avisosNome||[]).length).map(r=>`${r.arquivo}: nome fora do padrão (${r.avisosNome.join(' ')})`));
  if(avisosPos.length) aviso(avisosPos.join(' '), 30000);
  atualizarStatus().then(()=>{ if(aba==='tratar') renderTratar(); render(); });
  let auto=null; try{ auto=sessionStorage.getItem('agencias-auto'); sessionStorage.removeItem('agencias-auto'); }catch(_){}

}

// Mensagens locais, compostas a partir dos registros de cada envio.
// O gerador incorpora este arquivo no HTML para o painel funcionar sozinho.
let templateArquivo = '';
let templateBusca = '';
const templateRascunhos = new Map();
const COLUNAS_TEMPLATE = ['CAMPO_01','CAMPO_02','CAMPO_03','CAMPO_04',
  'CAMPO_05','CAMPO_06','CAMPO_07','CAMPO_08','CAMPO_09','CAMPO_10','CAMPO_11','CAMPO_12',
  'CAMPO_13','CAMPO_14','CAMPO_15','CAMPO_16','CAMPO_17','CAMPO_18','CAMPO_19','CAMPO_20'];

function textoNatural(texto){
  return String(texto||'').replace(/\([^)]*\)/g,'').replace(/[—–-]/g,' ').replace(/\s+/g,' ').trim();
}
function normalizarErro(texto){
  return String(texto||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
}
function linhasTexto(valores){
  const linhas = [...new Set(valores.filter(Number.isInteger))].sort((a,b)=>a-b);
  const partes = [];
  for(let i=0;i<linhas.length;i++){
    const inicio = linhas[i];
    let fim = inicio;
    while(i+1<linhas.length && linhas[i+1]===fim+1)fim=linhas[++i];
    partes.push(inicio===fim?String(inicio):`${inicio} a ${fim}`);
  }
  return partes.join(', ');
}
function gruposTemplate(envio){
  const grupos = Object.entries(envio.erros||{}).map(([motivo,quantidade])=>({motivo,quantidade,detalhes:[]}));
  const ordem = grupos.slice().sort((a,b)=>b.motivo.length-a.motivo.length);
  for(const detalhe of envio.ocorrencias||[]){
    const mensagem = normalizarErro(detalhe.mensagem);
    let grupo = ordem.find(g=>mensagem.startsWith(normalizarErro(g.motivo)));
    if(!grupo){
      const motivo = detalhe.mensagem.split(':')[0].trim();
      grupo = grupos.find(g=>g.motivo===motivo);
      if(!grupo){grupo={motivo,quantidade:0,detalhes:[]};grupos.push(grupo);}
    }
    grupo.detalhes.push(detalhe);
    grupo.quantidade=Math.max(grupo.quantidade,grupo.detalhes.length);
  }
  return grupos.sort((a,b)=>b.quantidade-a.quantidade);
}

function orientacaoTemplate(grupo,envio){
  const erro = normalizarErro(grupo.motivo);
  const detalhe = grupo.detalhes[0];
  const linha = detalhe?.linha || 2;
  const coluna = detalhe?.coluna || COLUNAS_TEMPLATE.find(c=>erro.includes(c)) || '';
  const letra = detalhe?.letra || (coluna?String.fromCharCode(65+COLUNAS_TEMPLATE.indexOf(coluna)):'');
  const celula = letra+linha;
  const formulas = [];
  let titulo = textoNatural(grupo.motivo), orientacao;
  const formula = (texto,valor)=>formulas.push({texto,valor});
  if(erro.includes('DUPLICIDADE')){
    titulo='Registros duplicados';
    orientacao='Encontramos registros com a mesma combinação de CAMPO_09, CAMPO_08, CAMPO_01, CAMPO_02, CAMPO_06, CAMPO_07 e CAMPO_04. Compare os dados com a emissão original e mantenha apenas o registro correto quando se tratar da mesma venda. Não exclua registros apenas porque o número do bilhete se repete, pois cupons e trajetos diferentes podem ser válidos.';
    const fim = Math.max(envio.total+1,linha,...grupo.detalhes.map(d=>d.linha));
    const criterios = ['I','H','A','B','F','G','D'].map(c=>`$${c}$2:$${c}$${fim};${c}${linha}`).join(';');
    formula('Para localizar combinações repetidas, use esta fórmula em uma coluna auxiliar. Um resultado maior que 1 indica que a combinação aparece mais de uma vez.',`=CONT.SES(${criterios})`);
  }else if(erro.includes('CAMPO_19')){
    titulo=erro.includes('VAZIO')?'Número de voo não preenchido':'Número de voo inválido';
    orientacao='Confira o número do voo na emissão e preencha CAMPO_19 com quatro dígitos. Por exemplo, 262 deve ficar 0262 e 10 deve ficar 0010. No tratamento automático, aproveitamos os números do campo e usamos 0001 quando o valor estiver vazio ou fora do intervalo permitido. Confira esse preenchimento com a emissão.';
    formula('Para formatar um número válido com quatro dígitos e usar 0001 quando o conteúdo não for válido, use:',`=SEERRO(SE(E(VALOR(${celula})>=1;VALOR(${celula})<=9999;MOD(VALOR(${celula});1)=0);TEXTO(VALOR(${celula});"0000");"0001");"0001")`);
  }else if(erro.includes('CAMPO_01') || erro.includes('CAMPO_02')){
    titulo='Datas da emissão e do embarque';
    orientacao='Confira as datas com o documento original. CAMPO_01 não pode ser posterior a CAMPO_02. Preencha ambas com uma data válida e mantenha o formato dia, mês e ano com quatro dígitos. Apenas mudar a aparência da célula não corrige uma data incorreta.';
    formula('Se a célula já contiver uma data válida do Excel, use esta fórmula para produzir o texto no formato esperado:',`=TEXTO(${celula};"dd/mm/aaaa")`);
    formula('Para conferir a ordem das duas datas, depois de convertê-las em datas válidas do Excel, use:',`=SE(A${linha}<=B${linha};"Ordem correta";"Revisar datas")`);
  }else if(erro.includes('CAMPO_03')){
    titulo='Horário de embarque';
    orientacao='Confira o horário original e preencha CAMPO_03 com hora e minuto separados por dois pontos, entre 00:00 e 23:59. Não substitua um horário desconhecido por um horário escolhido apenas para passar na validação.';
    formula('Se a célula já contiver um horário válido do Excel, use:',`=TEXTO(${celula};"hh:mm")`);
  }else if(erro.includes('CAMPO_09')){
    titulo=erro.includes('EMD')?'Documento EMD identificado':'Número do bilhete';
    const companhia = grupo.motivo.match(/CIA\s+'([^']+)'/i)?.[1];
    if(erro.includes('NAO NUMERICO'))titulo='Bilhete com caracteres não numéricos'+(companhia?' para a companhia '+textoNatural(companhia):'');
    else if(erro.includes('NOTACAO CIENTIFICA'))titulo='Bilhete em notação científica, com dígitos perdidos no Excel';
    else if(erro.includes('MAIS DE 13'))titulo='Formatação do bilhete no histórico anterior';
    else if(erro.includes('VAZIO'))titulo='Bilhete não preenchido';
    orientacao=erro.includes('EMD')
      ?'O documento foi identificado como EMD da VOARA pelo prefixo 44 ou 49. Separe esse registro da base de bilhetes. Não altere o número do documento para fazê-lo passar como uma passagem.'
      :'Confira CAMPO_09 na emissão original. O campo não pode ficar vazio e deve ter somente números, para todas as companhias. Preserve todos os dígitos e os zeros que fazem parte do identificador. Não há exigência de tamanho de 13 caracteres no tratamento atual e não criamos um número substituto.';
    if(erro.includes('NOTACAO CIENTIFICA'))orientacao='O bilhete chegou como número em notação científica, por exemplo 2,30901E+12. Isso acontece quando o CSV é aberto e salvo no Excel: os últimos dígitos do bilhete são trocados por zeros e não podem ser recuperados a partir deste arquivo. Envie novamente a base exportada direto do sistema, sem abrir e salvar no Excel, ou importe a coluna CAMPO_09 como Texto antes de salvar.';
    if(erro.includes('MAIS DE 13'))orientacao+=' Esse apontamento pertence à regra anterior. O tamanho, sozinho, não reprova mais o bilhete; basta executar novamente o tratamento com a regra atual.';
    if(!erro.includes('EMD'))formula('Quando o Excel já tiver armazenado o identificador numérico corretamente, use a fórmula abaixo para exibir os dígitos sem notação científica. Para bilhetes longos ou com zeros à esquerda, importe a coluna como Texto antes de abrir o CSV. A fórmula não recupera dígitos que o Excel já tenha alterado.',`=TEXTO(${celula};"0")`);
  }else if(erro.includes('CAMPO_15')){
    titulo='Preenchimento do CAMPO_15';
    orientacao='Confira o CAMPO_15 da empresa e mantenha os 14 dígitos quando o dado estiver correto. Ao optar pela correção automática, um CAMPO_15 inválido será substituído por um traço, sem inventar ou completar o identificador. Se tiver o dado correto, atualize a base a partir do cadastro da empresa.';
  }else if(erro.includes('CAMPO_05') || erro.includes('CAMPO_06') || erro.includes('CAMPO_07')){
    titulo='Códigos dos aeroportos';
    orientacao='Confira os aeroportos na emissão original. CAMPO_06 e CAMPO_07 devem conter exatamente três letras. No campo CAMPO_05, mantenha os códigos IATA com três letras maiúsculas, separados por barra. Corrija o código na fonte se ele não identificar o aeroporto correto.';
    formula('Para colocar as letras em maiúsculas e retirar espaços de um código já correto, use:',`=MAIÚSCULA(SUBSTITUIR(ARRUMAR(${celula});" ";""))`);
    const trechoJunto = detalhe?.mensagem.match(/invalido:\s*'([A-Za-z]+)'/i)?.[1];
    if(coluna==='CAMPO_05' && trechoJunto?.length>3 && trechoJunto.length%3===0 && trechoJunto.length<=60){
      const codigos = trechoJunto.match(/.{3}/g);
      const separar = codigos.map((_,i)=>`EXT.TEXTO(${celula};${i*3+1};3)`).join('&"/"&');
      formula(`Na linha ${linha}, o relatório registrou ${trechoJunto.length} letras consecutivas em CAMPO_05. Se cada grupo de três letras corresponder a um aeroporto do itinerário, esta fórmula separa os ${codigos.length} códigos com barra. Use somente nas linhas com essa mesma quantidade de letras e confira o resultado com a emissão:`, '='+separar);
    }
  }else if(erro.includes('CAMPO_04') || erro.includes('CAMPO_12')){
    titulo='Código da companhia aérea';
    orientacao='Confira a companhia na emissão e informe o código IATA válido de duas posições ou o código interno iniciado por G e seguido de números. A formatação não transforma um código inexistente em um código válido.';
    formula('Para um código correto que precise apenas de padronização, use:',`=MAIÚSCULA(ARRUMAR(${celula}))`);
  }else if(erro.includes('CAMPO_11')){
    titulo='Classe de serviço';
    orientacao='Confira a classe de serviço na emissão original. Preencha CAMPO_11 com um caractere. As classes OO e UU também são aceitas. Para células vazias, o tratamento oferece a opção de preencher P após a sua confirmação.';
    formula('Para preencher P somente quando a célula estiver vazia e preservar as demais classes, use:',`=SE(ARRUMAR(${celula})="";"P";${celula})`);
  }else if(erro.includes('CAMPO_13')){
    titulo='Valor da venda';
    orientacao='Confira o valor real da venda. Preencha CAMPO_13 com um número não negativo, sem símbolo de moeda e com vírgula decimal. Se o valor estiver ausente ou incorreto, consulte a origem da venda antes de preencher.';
    formula('Quando a célula já tiver o valor correto como número do Excel, use:',`=TEXTO(${celula};"0,00")`);
  }else if(erro.includes('CAMPO_16')){
    titulo='Identificação IATA da agência';
    orientacao='Confira o IATA da agência e preencha CAMPO_16 somente com números, entre 7 e 9 dígitos. Preserve os zeros que fazem parte do identificador. Não complete o campo com dígitos escolhidos sem conferir o cadastro.';
  }else if(erro.includes('CAMPO_18') || erro.includes('CAMPO_08')){
    titulo=erro.includes('CAMPO_18')?'Quantidade de passageiros':'Número do cupom';
    orientacao=`Confira ${coluna||'o campo indicado'} na emissão original e preencha com um número inteiro a partir de 1. O campo não pode ficar vazio. Não arredonde uma informação incorreta sem consultar a origem.`;
    formula('Para sinalizar valores vazios, fracionados ou menores que 1, use:',`=SEERRO(SE(E(VALOR(${celula})>=1;MOD(VALOR(${celula});1)=0);"Formato correto";"Revisar");"Revisar")`);
  }else if(erro.includes('CAMPO_10')){
    titulo='Tipo da viagem';
    orientacao='Confira o itinerário e preencha CAMPO_10 com N para viagem nacional ou I para viagem internacional.';
    formula('Para padronizar uma indicação correta que tenha espaços ou letras minúsculas, use:',`=MAIÚSCULA(ARRUMAR(${celula}))`);
  }else{
    orientacao='Confira o campo indicado com o documento original e corrija a informação na base de origem antes do próximo envio.';
  }
  return {titulo,orientacao,formulas:envio.cabecalho?.length?[]:formulas,coluna};
}

/* Resumo no topo do e-mail: se a base seria negada pelo banco e quais tipos de ajuste ela pede.
   Sem parênteses nem travessões fora das fórmulas, para o texto ficar limpo no e-mail. */
function resumoAjustes(envio,grupos){
  const s = envio.saude||{}, lim = (typeof D!=='undefined'&&D.limiteErroRobo)||5;
  const partes = [];
  const erroCrua = s.erroCrua, erroAj = s.erroAjustada;
  if(Number.isFinite(erroCrua) && erroCrua>lim)
    partes.push(`Atenção: a base chegou com ${fmtPct(erroCrua)} das linhas com erro. O banco aceita no máximo ${lim}%, então sem ajustes este arquivo seria negado por inteiro.`+
      (Number.isFinite(erroAj) && erroAj<=lim ? ` Depois do nosso tratamento ele ficou com ${fmtPct(erroAj)} e subiu, mas os pontos abaixo precisam ser corrigidos na origem.` : ''));
  else if(Number.isFinite(erroAj) && erroAj>lim)
    partes.push(`Atenção: mesmo depois do tratamento, ${fmtPct(erroAj)} das linhas continuam com erro. O banco aceita no máximo ${lim}%, então este arquivo seria negado por inteiro.`);
  const removidos = grupos.map(g=>`• ${orientacaoTemplate(g,envio).titulo}: ${fmtInt(g.quantidade)} ${g.quantidade===1?'ocorrência':'ocorrências'}`);
  const corrigidos = Object.entries(envio.errosCrua||{}).filter(([k])=>!(envio.erros||{})[k])
    .map(([k,v])=>`• ${textoNatural(k)}: ${fmtInt(v)} ${v===1?'linha':'linhas'}`);
  if(removidos.length) partes.push('Ajustes necessários para as linhas que ficaram de fora\n\n'+removidos.join('\n'));
  if(corrigidos.length) partes.push('Ajustes que fizemos no tratamento e que precisam ser corrigidos na origem\n\n'+corrigidos.join('\n'));
  const mantidos = Object.entries(envio.errosMantidos||{}).map(([k,v])=>`• ${textoNatural(k)}: ${fmtInt(v)} ${v===1?'linha':'linhas'}`);
  if(mantidos.length) partes.push('Linhas que subiram com erro e precisam ser corrigidas na origem\n\n'+mantidos.join('\n'));
  return partes;
}

function comporTemplate(envio){
  const grupos = gruposTemplate(envio);
  const nomeAgencia = textoNatural(envio.agencia);
  const assunto = `${envio.rejeitado||envio.removidos||envio.cabecalho?.length?'Ajustes':'Conferência'} na base de vendas ${nomeAgencia} ${envio.arquivo}`;
  const partes = ['Olá Pessoal!\nTudo bem?',
    `Conferimos o arquivo ${envio.arquivo} no tratamento realizado em ${dataBR(envio.dataProc)}.`];
  if(envio.rejeitado){
    partes.push('Não conseguimos iniciar a análise das linhas porque o arquivo não está no formato esperado. '+textoNatural(envio.motivo)+'.',
      'Por favor, salve a base em CSV com ponto e vírgula como separador. Mantenha os nomes das colunas e a ordem do layout e confira o arquivo em um editor de texto antes de reenviar.');
  }else{
    partes.push(`Na conferência, ${fmtInt(envio.aprovados)} linhas foram aprovadas e ${fmtInt(envio.removidos)} linhas ficaram fora da base liberada.`);
    partes.push(...resumoAjustes(envio,grupos));
    if(grupos.length){
      partes.push('Para ajudar na revisão, organizei abaixo os pontos encontrados e como conferir cada um.');
      if(grupos.some(g=>!g.detalhes.length))partes.push('O histórico disponível informa os erros, mas não preservou os números das linhas de todos os itens. Nesses casos, será necessário localizar os registros na base original. As fórmulas sem referência de linha registrada usam a linha 2 como exemplo. Ajuste a referência à linha que estiver revisando.');
      for(const grupo of grupos){
        const guia = orientacaoTemplate(grupo,envio);
        const conteudo = [guia.titulo,`Encontramos ${fmtInt(grupo.quantidade)} ${grupo.quantidade===1?'ocorrência':'ocorrências'}.`];
        if(grupo.detalhes.length){
          const campos = [...new Set(grupo.detalhes.map(d=>`${d.coluna} na coluna ${d.letra}`))];
          conteudo.push('Campo identificado: '+campos.join(', ')+'.');
          if(grupo.quantidade>grupo.detalhes.length)conteudo.push('O registro disponível informa apenas parte das posições. Confira também as demais ocorrências na base de origem.');
        }else{
          if(guia.coluna)conteudo.push('Campo para revisar: '+guia.coluna+'.');
        }
        conteudo.push(guia.orientacao);
        for(const f of guia.formulas)conteudo.push(f.texto+'\n'+f.valor);
        partes.push(conteudo.join('\n\n'));
      }
      partes.push('Uma mesma linha pode ter mais de um erro. Por isso, a soma das ocorrências pode ser maior que a quantidade de linhas removidas.');
    }else if(!envio.removidos && !envio.cabecalho?.length){
      partes.push('Não encontramos linhas removidas nem inconsistências de cabeçalho neste tratamento. Não há solicitação de correção pendente neste retorno.');
    }else if(envio.removidos){
      partes.push('O histórico disponível não preservou a descrição dos erros. Precisamos consultar o relatório do tratamento para indicar quais campos devem ser corrigidos.');
    }
    if(envio.cabecalho?.length){
      partes.push('Organização das colunas\n\nTambém encontramos diferenças no cabeçalho. '+envio.cabecalho.map(textoNatural).join('. ')+'.\n\nReorganize os nomes e a sequência conforme o layout da base. Faça esse ajuste antes de aplicar fórmulas, para que as referências apontem para as colunas corretas.');
    }
    if(grupos.some(g=>orientacaoTemplate(g,envio).formulas.length))partes.push('Use as fórmulas em colunas auxiliares no Excel em português. Antes de exportar, confira os resultados, copie as células corrigidas e cole somente os valores nas colunas originais. Preserve os identificadores e retire as colunas auxiliares do arquivo final.');
    if(envio.removidos || envio.cabecalho?.length)partes.push('Depois da revisão, salve o arquivo em CSV com ponto e vírgula como separador e reenvie a base corrigida para uma nova conferência. Preserve os registros aprovados e confira as correções antes de substituir a versão anterior.');
  }
  partes.push('Obrigado pela atenção.\nFico à disposição se precisarem de ajuda na revisão.');
  return {assunto,corpo:partes.join('\n\n')};
}

function arquivosTemplate(){
  const busca = templateBusca.trim().toLocaleLowerCase('pt-BR');
  return filtrados().slice().reverse().filter(e=>!busca || (e.arquivo+' '+e.agencia).toLocaleLowerCase('pt-BR').includes(busca));
}
function viewTemplate(){
  return `<div class="template-intro"><h2>Retorno para a agência</h2><p>Escolha o arquivo tratado para preparar a mensagem. Você pode ajustar o texto antes de copiar.</p></div>
    <div class="box template-selection"><div class="template-fields"><div class="f-campo"><label for="templateBusca">Localizar arquivo</label><input id="templateBusca" type="text" value="${esc(templateBusca)}" placeholder="Digite o arquivo ou a agência" oninput="templateBusca=this.value;atualizarTemplate()"></div><div class="f-campo"><label for="templateArquivo">Arquivo tratado</label><select id="templateArquivo" onchange="templateArquivo=this.value;atualizarTemplate()"></select></div></div><p class="template-meta" id="templateMeta"></p></div>
    <div id="templateContent"></div>`;
}
function atualizarTemplate(){
  if(aba!=='template')return;
  const arquivos = arquivosTemplate();
  if(!arquivos.some(e=>e.id===templateArquivo))templateArquivo=arquivos[0]?.id||'';
  const select = document.getElementById('templateArquivo');
  select.innerHTML = arquivos.length?arquivos.map(e=>`<option value="${esc(e.id)}" ${e.id===templateArquivo?'selected':''}>${esc(e.arquivo)} · ${esc(e.agencia)}</option>`).join(''):'<option value="">Nenhum arquivo encontrado</option>';
  select.disabled = !arquivos.length;
  const envio = arquivos.find(e=>e.id===templateArquivo);
  const content = document.getElementById('templateContent');
  if(!envio){document.getElementById('templateMeta').textContent='Nenhum envio corresponde à busca e aos filtros do painel.';content.innerHTML='<div class="vazio">Ajuste a busca ou limpe os filtros para escolher um arquivo.</div>';return;}
  document.getElementById('templateMeta').textContent=`${envio.agencia} · Tratado em ${dataBR(envio.dataProc)} às ${envio.horaProc} · ${fmtInt(envio.removidos)} linhas removidas`;
  // as linhas com erro não vêm no painel (deixariam a abertura lenta): busca no servidor ao abrir a mensagem
  if(envio.ocorrencias==null && envio.nOcorrencias && API.conectado && !envio._buscandoOcorrencias){
    envio._buscandoOcorrencias = true;
    content.innerHTML='<div class="box"><div class="carregando"><span class="giro"></span>Buscando as linhas com erro deste arquivo…</div></div>';
    api('/api/ocorrencias?id='+encodeURIComponent(envio.id))
      .then(r=>{ envio.ocorrencias = r.ocorrencias||[]; })
      .catch(()=>{ envio._semServidor = true; })
      .finally(()=>{ envio._buscandoOcorrencias = false; templateRascunhos.delete(envio.id); atualizarTemplate(); });
    return;
  }
  if(envio._buscandoOcorrencias) return;
  const mensagem = templateRascunhos.get(envio.id)||comporTemplate(envio);
  const comErros = gruposTemplate(envio).length;
  content.innerHTML=`${tabelaTratamento([envio],'Resultado do arquivo selecionado')}${comErros&&!envio.ocorrencias?.length?(envio.nOcorrencias&&envio.ocorrencias==null
        ?'<div class="template-notice">As posições das linhas com erro ficam no servidor do painel, que não está ligado. Abra o painel pelo atalho do painel para a mensagem trazer as linhas.</div>'
        :'<div class="template-notice">Este histórico preserva os tipos de erro, mas não as posições das linhas. A mensagem informa essa limitação.</div>'):''}
    <section class="box template-editor" aria-label="Mensagem para copiar"><div class="template-editor-head"><div><h3>Mensagem pronta</h3><p class="template-meta">${comErros?'Orientações baseadas nos erros deste arquivo':'Resultado da conferência deste arquivo'}</p></div><div class="template-actions"><button class="btn-limpar" onclick="restaurarTemplate()">Restaurar texto</button><button class="template-copy" onclick="copiarTemplate('corpo')">Copiar mensagem</button></div></div>
    <div class="template-subject"><label for="templateAssunto">Assunto</label><div><input id="templateAssunto" type="text" value="${esc(mensagem.assunto)}" oninput="salvarRascunhoTemplate()"><button class="btn-limpar" onclick="copiarTemplate('assunto')">Copiar assunto</button></div></div>
    <label class="template-body-label" for="templateCorpo">Texto do e-mail</label><textarea id="templateCorpo" spellcheck="true" oninput="salvarRascunhoTemplate()">${esc(mensagem.corpo)}</textarea>
    <p class="template-meta" id="templateCopyStatus" role="status" aria-live="polite">Edite o texto se precisar. O envio fica por sua conta.</p></section>`;
}
function salvarRascunhoTemplate(){
  templateRascunhos.set(templateArquivo,{assunto:document.getElementById('templateAssunto').value,corpo:document.getElementById('templateCorpo').value});
}
function restaurarTemplate(){templateRascunhos.delete(templateArquivo);atualizarTemplate();}
async function copiarTemplate(parte){
  const el=document.getElementById(parte==='assunto'?'templateAssunto':'templateCorpo');
  const status=document.getElementById('templateCopyStatus');
  try{
    if(!navigator.clipboard?.writeText)throw new Error('Clipboard indisponível');
    await navigator.clipboard.writeText(el.value);
    status.textContent=parte==='assunto'?'Assunto copiado.':'Mensagem copiada. Agora é só colar no e-mail.';
  }catch(_){
    el.focus();el.select();
    let copiou=false;
    try{copiou=document.execCommand('copy');}catch(_){}
    status.textContent=copiou?'Texto copiado.':'Texto selecionado. Pressione Ctrl + C para copiar.';
  }
}


iniciar();
</script>
