<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Manual das Agências · Demonstração</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --laranja:#FF7020; --laranja-esc:#DB5014; --ambar:#FFB414;
  --ok:#4fc57f; --warn:#ff6b6b; --anil:#2FA9CB;
  --bg:#101113; --surface:#17181b; --surface2:#1e1f23; --surface3:#26282c;
  --border:#2b2d32; --border2:#3a3d43;
  --text:#eeeeec; --text2:#a9a9a6; --muted:#77787c;
  --hm0:#1c1d20;
}
body.claro{
  --bg:#f5f5f3; --surface:#ffffff; --surface2:#f1f1ef; --surface3:#e7e6e3;
  --border:#e2e1dd; --border2:#cfcecb;
  --text:#15161a; --text2:#54555a; --muted:#8a8b8f;
  --ok:#2d9f5d; --warn:#d94b4b; --anil:#007895;
  --hm0:#e9e8e5;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}

.shell{display:flex;align-items:flex-start;max-width:1500px;margin:0 auto;}

.sidebar{width:262px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  padding:24px 20px;display:flex;flex-direction:column;gap:20px;align-self:flex-start;}
.marca{display:flex;align-items:center;gap:11px;}
.marca .sig{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,var(--laranja),var(--laranja-esc));font-weight:900;font-size:13px;color:#fff;}
.marca .txt small{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.marca .txt b{font-size:14px;font-weight:800;letter-spacing:-.01em;}

.f-secao{display:flex;flex-direction:column;gap:12px;}
.f-secao-titulo{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding-bottom:8px;border-bottom:1px solid var(--border);}
.f-campo{display:flex;flex-direction:column;gap:6px;}
.f-campo label{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
select,input[type=text]{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;color:var(--text);
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;
  outline:none;transition:.15s;width:100%;}
input[type=text]{cursor:text;font-weight:500;}
select:hover,select:focus,input[type=text]:focus{border-color:var(--laranja);}
.atalhos-col{display:flex;flex-direction:column;gap:2px;}
.atalho-item{display:block;width:100%;text-align:left;background:transparent;border:none;
  border-radius:7px;padding:7px 9px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:.13s;}
.atalho-item:hover{background:var(--surface2);color:var(--text);}
.atalho-item.on{background:rgba(255,112,32,.12);color:var(--laranja);font-weight:700;}
.btn-limpar{width:100%;padding:9px;border-radius:8px;border:1px dashed var(--border2);background:transparent;
  color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;}
.btn-limpar:hover{border-color:var(--laranja);color:var(--laranja);}

.sidebar-rodape{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:1px solid var(--border);}
.btn-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);
  color:var(--text2);font-size:12px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:.15s;}
.btn-toggle:hover{border-color:var(--border2);color:var(--text);}
.btn-toggle .marcador{width:32px;height:18px;border-radius:999px;background:var(--surface3);position:relative;flex:none;transition:.2s;}
.btn-toggle .marcador::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:var(--muted);transition:.2s;}
.btn-toggle.on .marcador{background:var(--laranja);}
.btn-toggle.on .marcador::after{left:16px;background:#fff;}

.conteudo{flex:1;min-width:0;padding:26px 32px 70px;}
@media(max-width:980px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);}
  .conteudo{padding:20px 16px 60px;}
}

.cab-pagina{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
.cab-pagina h1{font-size:22px;font-weight:800;letter-spacing:-.01em;}
.cab-pagina p{font-size:12.5px;color:var(--text2);margin-top:5px;max-width:640px;}
.carimbo{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;padding-top:4px;}

.nav{display:flex;gap:0;flex-wrap:wrap;margin-bottom:22px;border-bottom:1px solid var(--border);}
.nav-btn{padding:10px 4px;margin-right:22px;border:none;border-bottom:2px solid transparent;background:transparent;
  color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;}
.nav-btn:hover{color:var(--text);}
.nav-btn.on{color:var(--laranja);border-bottom-color:var(--laranja);font-weight:700;}

.view{display:none;}
.view.on{display:block;}
.titulo{display:flex;align-items:center;gap:13px;margin:30px 0 15px;}
.titulo:first-child{margin-top:0;}
.titulo h2{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;white-space:nowrap;}
.titulo-nota{font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.titulo i{flex:1;height:1px;background:var(--border);}
.grid{display:grid;gap:14px;}
.g4{grid-template-columns:repeat(4,1fr);} .g2{grid-template-columns:repeat(2,1fr);}
.g21{grid-template-columns:1.55fr 1fr;}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr);} .g21{grid-template-columns:1fr;}}
@media(max-width:700px){.g4,.g2{grid-template-columns:1fr;}}

.box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;}
.box h3{font-size:14px;font-weight:800;letter-spacing:-.01em;}
.box .sub{font-size:11.5px;color:var(--muted);margin-top:3px;margin-bottom:16px;}

.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;
  position:relative;overflow:hidden;transition:.15s;}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--laranja);}
.tile.v-ok::before{background:var(--ok);} .tile.v-warn::before{background:var(--warn);}
.tile.v-anil::before{background:var(--anil);} .tile.v-ambar::before{background:var(--ambar);}
.tile:hover{border-color:var(--border2);}
.tile .lb{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.tile .vl{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:6px;overflow-wrap:anywhere;}
.tile .vl.ok{color:var(--ok);} .tile .vl.warn{color:var(--warn);}
.tile .sb{font-size:10.5px;color:var(--text2);margin-top:5px;}

.kpi-combo{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;
  position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 1px 1fr;gap:16px;transition:.15s;}
.kpi-combo::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acento,var(--laranja));}
.kpi-combo:hover{border-color:var(--border2);}
.kpi-combo .div{background:var(--border);}
.kc-lb{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px;}
.kc-vl{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;}
.kc-vl.ok{color:var(--ok);} .kc-vl.warn{color:var(--warn);} .kc-vl.pri{color:var(--laranja);}
.kc-sb{font-size:10px;color:var(--text2);margin-top:4px;}

.wk{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;position:relative;transition:.15s;}
.wk:hover{border-color:var(--border2);}
.wk-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;}
.wk-t b{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:700;color:var(--laranja);letter-spacing:.02em;}
.wk-t span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);}
.wk-v{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:700;letter-spacing:-.02em;}
.wk-s{font-size:11px;color:var(--text2);margin-top:3px;}
.wk-g{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
.wk-g div span{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;}
.wk-g div b{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;}

.lg{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:var(--text2);}
.lg i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle;font-style:normal;}
.rank{display:flex;flex-direction:column;gap:13px;}
.rk{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;}
.rk .pos{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);font-weight:700;}
.rk .nm{font-size:12px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;}
.rk .nm span{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10.5px;}
.rk .tr{height:7px;border-radius:999px;background:var(--surface3);overflow:hidden;}
.rk .fl{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--laranja),var(--ambar));}
.rk .fl.w{background:linear-gradient(90deg,#c9453f,var(--warn));}
.rk .fl.b{background:linear-gradient(90deg,#1d6f87,var(--anil));}
.rk .qt{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:700;}

/* heatmap estilo GitHub: uma unica faixa continua de semanas (domingo a sabado),
   rotulo do mes fica posicionado (absolute) exatamente acima da coluna onde ele comeca. */
.hm-grafico{overflow-x:auto;padding-bottom:6px;}
.hm-inner{display:inline-block;}
.hm-cab{position:relative;height:14px;margin:0 0 5px 32px;}
.hm-cab span{position:absolute;top:0;font-size:9.5px;font-family:'IBM Plex Mono',monospace;color:var(--muted);white-space:nowrap;}
.hm-corpo{display:flex;align-items:flex-start;gap:8px;}
.hm-dow{display:grid;grid-template-rows:repeat(7,11px);gap:3px;width:24px;flex:none;}
.hm-dow span{font-size:9px;font-family:'IBM Plex Mono',monospace;color:var(--muted);line-height:11px;}
.hm-grid{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px;}
.hm-cel{width:11px;height:11px;border-radius:2px;background:var(--hm0);border:1px solid transparent;transition:.12s;}
.hm-cel:hover{border-color:var(--laranja);transform:scale(1.45);}
.hm-cel.futuro{background:transparent;border:1px dashed var(--border);}
.hm-cel.hoje{box-shadow:0 0 0 1.5px var(--ambar);}
.escala{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.escala i{width:14px;height:14px;border-radius:3px;display:inline-block;}

.tb{width:100%;border-collapse:collapse;font-size:12.5px;}
.tb th{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;
  text-align:right;padding:9px 11px;border-bottom:1px solid var(--border2);white-space:nowrap;}
.tb th:first-child,.tb td:first-child{text-align:left;}
.tb td{padding:10px 11px;border-bottom:1px solid var(--border);text-align:right;
  font-family:'IBM Plex Mono',monospace;font-size:12px;white-space:nowrap;}
.tb td:first-child{font-family:'Inter',sans-serif;font-weight:700;white-space:normal;}
.tb tbody tr:hover td{background:var(--surface2);}
.tb td.pos,.tb b.pos{color:var(--ok);} .tb td.neg,.tb b.neg{color:var(--warn);}
.tb td.txt{font-family:'Inter',sans-serif;text-align:left;white-space:normal;color:var(--text2);font-size:11.5px;}
.chip{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;
  padding:3px 9px;border-radius:999px;border:1px solid;}
.chip.ok{color:var(--ok);border-color:rgba(79,197,127,.35);background:rgba(79,197,127,.1);}
.chip.warn{color:var(--warn);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.1);}
.scr{max-height:560px;overflow:auto;margin:0 -6px;padding:0 6px;}
.scr::-webkit-scrollbar{width:9px;height:9px;}
.scr::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:9px;}

.nota{display:grid;grid-template-columns:30px 1fr;gap:14px;align-items:start;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px;}
.nota .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;
  background:rgba(255,112,32,.13);color:var(--laranja);}
.nota.ok .ic{background:rgba(79,197,127,.13);color:var(--ok);}
.nota.warn .ic{background:rgba(255,107,107,.13);color:var(--warn);}
.nota.info .ic{background:rgba(47,169,203,.13);color:var(--anil);}
.nota b{font-size:13px;font-weight:700;display:block;margin-bottom:4px;}
.nota p{font-size:12.5px;color:var(--text2);line-height:1.55;}
.nota p b{display:inline;color:var(--text);}
.vazio{border:1px dashed var(--border);border-radius:14px;padding:52px 26px;text-align:center;color:var(--muted);font-size:13px;}
.mask{cursor:pointer;letter-spacing:.04em;border-bottom:1px dashed var(--border2);}
.mask:hover{color:var(--laranja);border-color:var(--laranja);}

.foot{margin-top:48px;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;
  gap:14px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);}
@media print{.sidebar,.nav{display:none!important;} .view{display:block!important;}
  .shell{display:block;} body{background:#fff;color:#000;} .box,.tile,.wk,.kpi-combo{break-inside:avoid;}}
@media(max-width:640px){.scr{max-height:none;} .box{padding:16px 14px;} .tb{font-size:11.5px;}}

/* Identidade compartilhada com o Sena Planner */
:root{--bg:#111111;--surface:#181818;--surface2:#222222;--surface3:#2a2a2a;
--border:#343434;--border2:#505050;--text:#f2f2f2;--text2:#b6b6b6;--muted:#a3a3a3;
--ok:#8de0ae;--warn:#ff9aa9;--anil:#a0baff;--hm0:#222;--laranja:#f3ac79;--ambar:#f1ca70;}
body.claro{--bg:#f6f6f5;--surface:#fff;--surface2:#f0f0ee;--surface3:#e8e8e5;
--border:#dededb;--border2:#bbb;--text:#202020;--text2:#555;--muted:#626262;
--ok:#237347;--warn:#ad334d;--anil:#365ba5;--laranja:#a54c18;--ambar:#876114;--hm0:#eee;}
body{font-size:14px;}button,input,select{font-family:inherit;}button{cursor:pointer;}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,.mask:focus-visible{
outline:2px solid var(--text);outline-offset:4px;}
.shell{max-width:none;min-height:100vh;}
.sidebar{width:232px;position:sticky;top:0;height:100vh;padding:30px 16px;gap:28px;}
.marca{padding:0 12px;gap:12px;}.marca .sig{background:none;color:var(--text);width:28px;height:36px;}
.marca .sig svg{width:25px;height:30px;}.marca .txt small{font-size:10px;letter-spacing:.12em;}.marca .txt b{font-size:15px;}
.side-heading{font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--muted);margin:0 12px 12px;}
.side-nav{display:flex;flex-direction:column;gap:5px;}.side-nav button{display:flex;align-items:center;gap:12px;
border:0;border-radius:10px;padding:12px;color:var(--text2);background:none;font-size:14px;font-weight:600;text-align:left;min-height:46px;}
.side-nav button:hover{background:var(--surface2);color:var(--text);}.side-nav button.on{background:var(--surface3);color:var(--text);}
.ui-icon{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.side-info{margin:auto 12px 0;font-size:12px;color:var(--text2);line-height:1.7;}.side-info strong{display:block;color:var(--text);font-weight:600;margin-bottom:5px;}
.side-info .source-dot{display:inline-block;width:7px;height:7px;background:var(--ok);border-radius:50%;margin-right:6px;}
.sidebar-rodape{margin-top:0;padding:0 8px;border:0;gap:5px;}.btn-toggle{border:0;background:none;min-height:42px;padding:8px 4px;font-size:12px;}
.btn-toggle.on .marcador{background:var(--text2);}.btn-toggle.on .marcador::after{background:var(--bg);}
.conteudo{padding:30px 40px 48px;max-width:1900px;margin:auto;}
.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:20px;display:flex;align-items:center;gap:9px;}.breadcrumb b{font-weight:500;color:var(--text2);}
.cab-pagina{margin-bottom:24px;align-items:center;}.cab-pagina h1{font-size:30px;letter-spacing:-.055em;font-weight:750;}
.cab-pagina p{font-size:14px;max-width:760px;line-height:1.6;color:var(--text2);}.carimbo{font-family:Inter,sans-serif;font-size:12px;white-space:normal;max-width:220px;}
.nav{margin-bottom:24px;gap:12px;}.nav-btn{color:var(--text2);font-size:14px;padding:12px 6px;margin-right:10px;display:flex;gap:8px;align-items:center;min-height:46px;}
.nav-btn.on{color:var(--text);border-color:var(--text);}.nav-btn .tab-count{font-size:11px;border-radius:5px;background:var(--surface3);padding:1px 6px;}
.filter-panel{margin-top:28px;border:1px solid var(--border);background:var(--surface);border-radius:14px;margin-bottom:28px;overflow:hidden;}
.filter-toolbar{display:flex;gap:16px;align-items:center;padding:16px 20px;flex-wrap:wrap;}
.search-field{display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:0 12px;flex:1;min-width:200px;}
.search-field input{border:0!important;background:none!important;padding:11px 0!important;font-size:13px;min-height:42px;}
.search-field:focus-within{outline:2px solid var(--text);outline-offset:2px;}.search-field input:focus{outline:none;}
.atalhos-col{flex-direction:row;background:var(--surface2);padding:4px;border-radius:9px;gap:3px;flex-wrap:wrap;}
.atalho-item{width:auto;min-height:34px;white-space:nowrap;padding:7px 11px;font-size:12px;}
.atalho-item.on{background:var(--surface);color:var(--text);}
.filter-details{border-top:1px solid var(--border);}.filter-details summary{padding:12px 20px;font-size:13px;cursor:pointer;color:var(--text2);display:flex;align-items:center;gap:8px;list-style:none;}
.filter-details summary::-webkit-details-marker{display:none;}.filter-details summary:after{content:'+';margin-left:auto;font-size:19px;}.filter-details[open] summary:after{content:'−';}
.f-secao{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:4px 20px 20px;gap:14px;}
.f-campo label{text-transform:none;font-size:12px;letter-spacing:0;color:var(--text2);font-weight:500;}
select{min-height:40px;font-size:12px;font-weight:500;padding:9px 8px;color-scheme:dark;}body.claro select{color-scheme:light;}
.filter-bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 20px;border-top:1px solid var(--border);}
.filter-summary{font-size:12px;color:var(--text2);}.btn-limpar{width:auto;border:1px solid var(--border);padding:7px 11px;color:var(--text2);font-size:12px;min-height:36px;white-space:nowrap;}
.titulo{margin:28px 0 14px;gap:12px;flex-wrap:wrap;}.titulo h2{font-size:16px;letter-spacing:-.02em;text-transform:none;color:var(--text);font-weight:650;}
.titulo-nota{font-family:Inter,sans-serif;white-space:normal;font-size:12px;color:var(--text2);}.titulo i{display:none;}
.box,.wk,.tile,.kpi-combo{border-radius:12px;padding:20px;background:var(--surface);}.box h3{font-size:15px;font-weight:650;}
.box .sub{font-size:12px;color:var(--text2);line-height:1.6;}.kpi-combo::before,.tile::before{display:none;}
.tile .lb,.kc-lb{font-size:12px;text-transform:none;letter-spacing:0;color:var(--text2);font-weight:500;}
.tile .vl,.kc-vl{font-family:Inter,sans-serif;font-variant-numeric:tabular-nums;font-size:26px;letter-spacing:-.05em;font-weight:700;white-space:normal;overflow-wrap:anywhere;}
.tile .sb,.kc-sb{font-size:12px;color:var(--text2);line-height:1.5;}.kc-vl.pri{color:var(--text);}.kpi-combo{gap:20px;}
.wk-t b{font-family:Inter,sans-serif;font-size:14px;color:var(--text);letter-spacing:0;}.wk-t span,.wk-g div b{font-family:Inter,sans-serif;font-variant-numeric:tabular-nums;}
.wk-v{font-family:Inter,sans-serif;font-size:30px;letter-spacing:-.04em;}.wk-s{font-size:12px;}.wk-g{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
.wk-g div span{font-size:10px;letter-spacing:.04em;}.wk-g div b{font-size:12px;overflow-wrap:anywhere;}
.overview-signal{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:20px;}
.overview-signal strong{font-size:14px;font-weight:600;}.overview-signal p{font-size:12px;color:var(--text2);margin-top:3px;}.signal-label{font-size:12px;color:var(--ok);display:flex;align-items:center;gap:8px;white-space:nowrap;}
.signal-label.warn{color:var(--warn);}.summary-kpis{margin-bottom:24px;}.summary-kpis .tile{padding:18px 20px;}
.tb th{font-size:10px;color:var(--text2);background:var(--surface2);padding:13px 12px;position:sticky;top:0;z-index:1;}.tb td{font-family:Inter,sans-serif;font-variant-numeric:tabular-nums;font-size:12px;padding:14px 12px;}.tb td:first-child{font-weight:500;max-width:320px;overflow-wrap:anywhere;}
.tb .txt{min-width:170px;}.scr{max-height:580px;margin:0 -20px;padding:0 20px;}.chip{font-family:Inter,sans-serif;border:0;border-radius:6px;font-size:11px;padding:4px 8px;}
.rank .fl{background:var(--laranja);}.rank .fl.w{background:var(--warn);}.rank .fl.b{background:var(--anil);}.rk .qt,.rk .nm span,.rk .pos,.escala,.foot{font-family:Inter,sans-serif;}
.rk .nm{font-size:13px;}.nota{padding:18px 20px;}.nota b{font-weight:600;}.nota p{font-size:13px;}.foot{font-size:11px;color:var(--text2);margin-top:32px;}
.mask{border:0;background:none;padding:0;color:inherit;font:inherit;letter-spacing:.03em;text-align:inherit;}.mask:hover{color:var(--text);}
.vazio{font-size:14px;color:var(--text2);padding:50px 24px;line-height:1.8;}
@media(min-width:1700px){.summary-kpis .tile .vl{font-size:30px;}}
@media(max-width:1250px){.sidebar{width:210px;}.conteudo{padding:26px 24px;}.f-secao{grid-template-columns:repeat(3,minmax(0,1fr));}.wk-g{grid-template-columns:1fr 1fr;}.g4{grid-template-columns:1fr 1fr;}}
@media(max-width:980px){.shell{flex-direction:row;}.sidebar{width:190px;border-right:1px solid var(--border);border-bottom:0;}.marca{padding:0;}.marca .txt b{font-size:13px;}.g2,.g21{grid-template-columns:1fr;}.filter-toolbar{gap:10px;}.conteudo{padding:24px 20px;}}
@media(max-width:700px){.shell{display:block;}.sidebar{position:relative;height:auto;width:100%;padding:16px;border-right:0;border-bottom:1px solid var(--border);gap:16px;}
.side-heading,.side-info{display:none;}.sidebar-rodape{display:flex;flex-direction:row;gap:24px;padding:0 6px;}.sidebar-rodape .btn-toggle{width:auto;gap:12px;}.side-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}.side-nav button{justify-content:center;font-size:11px;padding:10px 4px;gap:5px;}.side-nav .ui-icon{width:14px;height:14px;}
.conteudo{padding:24px 16px;}.breadcrumb{margin-bottom:12px;}.cab-pagina h1{font-size:27px;}.cab-pagina p{font-size:13px;}.carimbo{max-width:none;font-size:11px;}.nav{display:none;}
.filter-toolbar{padding:14px;}.search-field{min-width:100%;}.atalhos-col{width:100%;justify-content:space-between;}.atalho-item{padding:6px 8px;font-size:11px;}
.f-secao{grid-template-columns:1fr 1fr;padding:4px 14px 16px;}.filter-details summary,.filter-bottom{padding:12px 14px;}.filter-bottom{align-items:flex-start;}.g4{grid-template-columns:1fr 1fr;gap:10px;}
.summary-kpis .tile{padding:16px 12px;}.tile .vl,.kc-vl{font-size:24px;}.tile .sb,.kc-sb{font-size:11px;}.overview-signal{align-items:flex-start;flex-direction:column;}.kpi-combo{gap:12px;padding:18px 14px;}
.wk-g{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}.wk-g div b{font-size:11px;}.scr{max-height:520px;}.box{padding:18px;}.titulo-nota{width:100%;}.box .sub{margin-bottom:14px;}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important;}.hm-cel:hover{transform:none;}}
@media print{.filter-panel,.breadcrumb,.overview-signal{display:none!important;}.conteudo{max-width:none;padding:0;}}


.template-intro{margin:0 0 20px;}.template-intro h2{font-size:20px;font-weight:650;letter-spacing:-.03em;}.template-intro p{font-size:13px;color:var(--text2);margin-top:6px;}
.template-selection{margin-bottom:20px;}.template-fields{display:grid;grid-template-columns:minmax(180px,.7fr) minmax(0,1.3fr);gap:20px;}.template-fields select{font-size:13px;min-height:44px;}.template-fields input{font-size:13px;min-height:44px;}
.template-meta{font-size:12px;color:var(--text2);line-height:1.7;margin-top:12px;}.template-notice{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--ambar);border-radius:9px;padding:14px 18px;font-size:13px;color:var(--text2);margin-bottom:16px;}
.template-editor{padding:24px;}.template-editor-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}.template-editor-head .template-meta{margin-top:3px;}.template-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.template-copy{border:1px solid var(--text);background:var(--text);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:650;min-height:42px;}.template-copy:hover{opacity:.85;}
.template-subject label,.template-body-label{display:block;font-size:12px;color:var(--text2);margin-bottom:8px;}.template-subject>div{display:flex;gap:10px;align-items:center;}.template-subject input{font-size:13px;font-weight:500;min-height:42px;}.template-subject button{flex:none;min-height:42px;}.template-body-label{margin-top:20px;}
#templateCorpo{width:100%;min-height:640px;padding:22px 24px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-family:Inter,sans-serif;font-size:14px;line-height:1.85;resize:vertical;}
@media(max-width:700px){.side-nav{grid-template-columns:repeat(5,minmax(0,1fr));}.side-nav button{flex-direction:column;gap:5px;font-size:10px;}.template-fields{grid-template-columns:minmax(0,1fr);gap:16px;}.template-editor{padding:18px;}.template-subject>div{flex-wrap:wrap;}.template-subject input{min-width:0;}#templateCorpo{padding:16px;font-size:13px;min-height:580px;}.template-actions{width:100%;}.template-actions button{flex:1;}}
@media print{.template-actions,.template-selection,.template-subject button{display:none!important;}}

.metrics-table .metric-col{white-space:normal;min-width:128px;max-width:160px;line-height:1.5;}
.metrics-table td:first-child{position:sticky;left:0;z-index:2;background:var(--surface);min-width:210px;max-width:280px;}
.metrics-table th:first-child{position:sticky;left:0;z-index:3;background:var(--surface2);}
.metric-missing{font-size:11px;color:var(--text2);font-style:normal;}
/* ---------- companhias (paleta validada: rótulos sempre visíveis) ---------- */
:root{--cia-voara:#d95926;--cia-celesta:#3987e5;--cia-nuvex:#a83d84;--cia-outras:#6f6f6c;--novo:#f1ca70;}
body.claro{--cia-voara:#eb6834;--cia-celesta:#2a78d6;--cia-nuvex:#c23a7d;--cia-outras:#a3a29e;--novo:#876114;}
[hidden]{display:none!important;}
.skip{position:absolute;left:-999px;top:8px;background:var(--text);color:var(--bg);padding:8px 12px;border-radius:8px;z-index:100;}
.skip:focus{left:8px;}

/* uma aba por tema: o menu lateral é a navegação; a faixa de abas no topo fica só no código */
.nav{display:none!important;}
.sidebar{width:252px!important;}
.cab-pagina p .recorte{display:block;margin-top:6px;font-size:12.5px;color:var(--muted);}
.filter-toolbar{padding:12px 16px;} .filter-details summary{padding:10px 16px;} .filter-bottom{padding:8px 16px;}
.side-grupo{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:14px 12px 6px;}
.side-grupo:first-child{margin-top:0;}
.side-nav button{min-height:42px;padding:10px 12px;font-size:13.5px;}
.side-nav button span:first-of-type{flex:1;}
.side-nav .tab-count{font-size:11px;border-radius:5px;background:var(--surface3);padding:1px 6px;color:var(--text2);}
.aba-intro{font-size:14px;line-height:1.65;color:var(--text2);max-width:820px;margin:0 0 26px;padding:14px 18px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);}
.view .titulo{margin-top:36px;}
.view .titulo:first-child,.aba-intro + .titulo{margin-top:0;}
.summary-kpis{margin-bottom:8px;}
.lista-atencao{display:flex;flex-direction:column;gap:8px;}
.item-atencao{display:grid;grid-template-columns:auto minmax(160px,1fr) 2fr;gap:16px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px 16px;color:var(--text);font:inherit;}
.item-atencao:hover{border-color:var(--text2);}
.ia-nome b{display:block;font-size:13.5px;font-weight:650;} .ia-nome small{display:block;font-size:11.5px;color:var(--text2);overflow-wrap:anywhere;}
.ia-motivo{font-size:12.5px;color:var(--text2);line-height:1.5;}
.atalhos-abas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;}
.atalho-aba{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;color:var(--text);font:inherit;width:100%;}
.atalho-aba:hover{border-color:var(--text2);} .atalho-aba .ui-icon{width:22px;height:22px;color:var(--text2);}
.atalho-aba b{display:block;font-size:14px;font-weight:650;} .atalho-aba small{display:block;font-size:12px;color:var(--text2);margin-top:2px;}
.atalho-aba > span:nth-of-type(1){flex:1;} .seta-dir{color:var(--text2);font-size:18px;}
@media(max-width:1250px){.sidebar{width:220px!important;}}
@media(max-width:980px){.sidebar{width:200px!important;}}
@media(max-width:700px){.sidebar{width:100%!important;}}
@media(max-width:700px){.item-atencao{grid-template-columns:1fr;gap:6px;} .side-grupo{display:none;} .aba-intro{font-size:13px;padding:12px 14px;}}

/* filtros acima dos indicadores */
.filter-panel{margin:0 0 24px;}
.f-secao{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}

/* cabeçalho */
.cab-acoes{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
.btn-pri{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--text);background:var(--text);color:var(--bg);
  border-radius:9px;padding:10px 14px;font-size:13px;font-weight:650;min-height:42px;white-space:nowrap;}
.btn-pri:hover{opacity:.88;} .btn-pri[disabled]{opacity:.45;cursor:not-allowed;}
.btn-sec{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border2);background:var(--surface);color:var(--text);
  border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:600;min-height:40px;white-space:nowrap;}
.btn-sec:hover{border-color:var(--text2);} .btn-sec[disabled]{opacity:.45;cursor:not-allowed;}
.btn-pri .qtd{background:var(--bg);color:var(--text);border-radius:6px;padding:0 6px;font-size:11px;}
.srv{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11.5px;color:var(--text2);}
.srv i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;}
.srv.on i{background:var(--ok);}

/* chips e destaques */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:650;line-height:1;padding:4px 7px;border-radius:6px;
  background:var(--surface3);color:var(--text2);white-space:nowrap;vertical-align:middle;}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);}
.tag.amb{background:color-mix(in srgb,var(--ambar) 18%,transparent);color:var(--ambar);}
.tag.novo{background:color-mix(in srgb,var(--novo) 20%,transparent);color:var(--novo);}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
tr.destaque td:first-child{box-shadow:inset 3px 0 0 var(--novo);}
tr.clicavel{cursor:pointer;} tr.clicavel:focus-visible{outline:2px solid var(--text);outline-offset:-2px;}
.pp{font-size:11.5px;font-weight:650;} .pp.up{color:var(--ok);} .pp.zero{color:var(--text2);} .pp.down{color:var(--warn);}

/* tiles maiores */
.tile .vl small{font-size:14px;color:var(--text2);font-weight:600;letter-spacing:0;}
.tile.clicavel{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;}
.tile.clicavel:hover{border-color:var(--text2);}
.tile.sel{border-color:var(--text);}
.seta{color:var(--text2);font-weight:500;margin:0 4px;}
.g3{grid-template-columns:repeat(3,1fr);}
.g5{grid-template-columns:repeat(5,minmax(0,1fr));}
@media(max-width:1250px){.g5{grid-template-columns:repeat(3,1fr);} .g3{grid-template-columns:1fr 1fr;}}
@media(max-width:700px){.g5,.g3{grid-template-columns:1fr 1fr;}}

/* barras empilhadas (2px de respiro entre segmentos) */
.pilha{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;background:var(--surface3);}
.pilha.alta{height:30px;border-radius:6px;}
.pilha span{display:block;height:100%;min-width:2px;}
.pilha span:first-child{border-radius:4px 0 0 4px;} .pilha span:last-child{border-radius:0 4px 4px 0;}
.leg{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--text2);}
.leg span{display:inline-flex;align-items:center;gap:6px;}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;}
.leg b{color:var(--text);font-weight:650;}
.c-voara{background:var(--cia-voara);} .c-celesta{background:var(--cia-celesta);} .c-nuvex{background:var(--cia-nuvex);} .c-outras{background:var(--cia-outras);}
.s-antes{background:var(--anil);} .s-recup{background:var(--ok);} .s-aceita{background:var(--ambar);} .s-rem{background:var(--warn);}
.s-antes,.s-recup,.s-aceita,.s-rem{opacity:.9;}

/* funil */
.funil-tb{width:100%;border-collapse:collapse;margin-top:16px;font-size:12.5px;}
.funil-tb td{padding:9px 4px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums;}
.funil-tb td:not(:first-child){text-align:right;white-space:nowrap;}
.funil-tb td:first-child span.nm{display:inline-flex;align-items:center;gap:8px;}
.funil-tb i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;}

/* companhia */
.cia-card{display:flex;flex-direction:column;gap:8px;}
.cia-card .nome{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);font-weight:600;}
.cia-card .nome i{width:10px;height:10px;border-radius:3px;}
.cia-card .vl{font-size:24px;}
.cia-card .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text2);gap:8px;}

/* anel de saúde */
.anel{position:relative;display:inline-grid;place-items:center;flex:none;}
.anel svg{transform:rotate(-90deg);}
.anel .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.03em;}
.f-saudavel{color:var(--ok);} .f-atencao{color:var(--ambar);} .f-critica{color:var(--warn);} .f-sem{color:var(--muted);}

/* ranking de agências */
.rk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
.ag-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;text-align:left;color:var(--text);
  display:flex;flex-direction:column;gap:14px;font:inherit;width:100%;}
.ag-card:hover{border-color:var(--text2);}
.ag-topo{display:flex;align-items:center;gap:14px;}
.ag-pos{font-size:12px;color:var(--text2);font-weight:650;font-variant-numeric:tabular-nums;width:22px;}
.ag-nome{font-size:15px;font-weight:650;line-height:1.3;overflow-wrap:anywhere;}
.ag-sub{font-size:11.5px;color:var(--text2);margin-top:3px;}
.ag-num{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ag-num div span{display:block;font-size:11px;color:var(--text2);}
.ag-num div b{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;}
.ordem{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:9px;flex-wrap:wrap;}
.ordem button{border:0;background:none;color:var(--text2);border-radius:7px;padding:7px 11px;font-size:12px;font-weight:600;min-height:34px;}
.ordem button.on{background:var(--surface);color:var(--text);}

/* antes x depois (halteres) */
.hlt{display:flex;flex-direction:column;gap:2px;}
.hlt-row{display:grid;grid-template-columns:minmax(120px,240px) 1fr 108px;gap:14px;align-items:center;padding:7px 6px;border-radius:8px;
  border:0;background:none;color:var(--text);text-align:left;font:inherit;width:100%;}
.hlt-row:hover{background:var(--surface2);}
.hlt-nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hlt-nm small{display:block;font-size:11px;color:var(--text2);font-weight:500;}
.hlt-tr{position:relative;height:22px;}
.hlt-tr .base{position:absolute;left:0;right:0;top:10px;height:2px;background:var(--surface3);border-radius:2px;}
.hlt-tr .lim{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed color-mix(in srgb,var(--warn) 70%,transparent);}
.hlt-tr .liga{position:absolute;top:9px;height:4px;background:var(--text2);opacity:.45;border-radius:2px;}
.hlt-tr .pt{position:absolute;top:3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:2px solid var(--surface);}
.hlt-tr .pt.a{background:var(--anil);} .hlt-tr .pt.d{background:var(--ok);}
.hlt-tr .pt.p{background:transparent;border:2px dashed var(--text2);width:14px;height:14px;margin-left:-7px;top:4px;}
.hlt-vl{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.hlt-eixo{display:grid;grid-template-columns:minmax(120px,240px) 1fr 108px;gap:14px;font-size:10.5px;color:var(--text2);padding:0 6px;}
.hlt-eixo .ticks{position:relative;height:14px;}
.hlt-eixo .ticks span{position:absolute;transform:translateX(-50%);}
@media(max-width:700px){.hlt-row,.hlt-eixo{grid-template-columns:96px 1fr 70px;gap:8px;}}

/* gaveta de detalhe */
.drawer-fundo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);border-left:1px solid var(--border);
  z-index:41;overflow-y:auto;padding:26px 28px 40px;box-shadow:-20px 0 60px rgba(0,0,0,.35);}
.drawer[hidden],.drawer-fundo[hidden]{display:none;}
.dr-topo{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px;}
.dr-topo h2{font-size:21px;font-weight:700;letter-spacing:-.03em;overflow-wrap:anywhere;}
.dr-topo p{font-size:12.5px;color:var(--text2);margin-top:4px;}
.dr-fechar{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;width:40px;height:40px;flex:none;font-size:18px;}
.dr-sec{margin-top:22px;}
.dr-sec h3{font-size:14px;font-weight:650;margin-bottom:12px;}
.saude-box{display:flex;gap:20px;align-items:center;}
.saude-box .comp{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:12.5px;flex:1;}
.saude-box .comp span{color:var(--text2);} .saude-box .comp b{font-variant-numeric:tabular-nums;font-weight:650;text-align:right;}
.robo-bar{position:relative;height:10px;background:var(--surface3);border-radius:5px;margin-top:10px;}
.robo-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;}

   2. Formatação
   ====================================================================== */

const vazioN = v => v===null||v===undefined||isNaN(v);
const fmtInt = v => vazioN(v) ? '–' : Math.round(Number(v)).toLocaleString('pt-BR');
const fmtDec = (v,d=1) => vazioN(v) ? '–' : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
// Nunca arredonda para 0% algo que existe (nem para 100% algo incompleto): 2 linhas em 13 mil
// aparecem como 0,02%, não como 0,0%. Abaixo de 0,001% mostra "< 0,001%".
const fmtPct = (v,d=1) => {
  if(vazioN(v)) return '–';
  v = Number(v);
  if(typeof LIM==='number' && Math.abs(v-LIM)<0.05) d = Math.max(d,2);   // 5,04% não vira 5,0% ao lado de "não sobe"
  if(v>0 && v<100){
    let dd = d;
    while(dd<3 && [0,100].includes(Number(v.toFixed(dd)))) dd++;
    if(Number(v.toFixed(dd))===0) return '< '+fmtDec(10**-dd,dd)+'%';
    if(Number(v.toFixed(dd))===100) return '> '+fmtDec(100-10**-dd,dd)+'%';
    return fmtDec(v,dd)+'%';
  }
  return fmtDec(v,d)+'%';
};
const linhasTxt = n => `${fmtInt(n)} linha${n===1?'':'s'}`;
const pct = (a,b) => b ? a/b*100 : null;
const fmtBRL = v => {
  if (vazioN(v)) return '–';
  if (!verValores) return 'R$ ••••••';
  const a = Math.abs(v);
  if (a>=1e6) return 'R$ '+fmtDec(v/1e6,2)+' mi';
  if (a>=1e3) return 'R$ '+fmtDec(v/1e3,0)+' mil';
  return 'R$ '+fmtDec(v,2);
};
const fmtBRLCheio = v => vazioN(v) ? '–' : verValores ? 'R$ '+fmtDec(v,2) : 'R$ ••••••••';
// span com papel de botão: a máscara também aparece dentro de cartões clicáveis (botão dentro de botão quebra o HTML)
const mascara = t => `<span class="mask" role="button" tabindex="0" onclick="event.stopPropagation();alternarValores()" title="Clique para exibir os valores" aria-label="Exibir valores financeiros">${t}</span>`;
const brl = v => (verValores||vazioN(v)) ? fmtBRL(v) : mascara(fmtBRL(v));
const brlCheio = v => (verValores||vazioN(v)) ? fmtBRLCheio(v) : mascara(fmtBRLCheio(v));
const dataBR = iso => { if(!iso) return '–'; const p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; };
const dataExtenso = iso => { if(!iso) return ''; const [a,m,d] = iso.split('-').map(Number); return `${String(d).padStart(2,'0')} de ${MESES_NOME[m-1]} de ${a}`; };
const esc = t => String(t===null||t===undefined?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const novaData = iso => { const [a,m,d]=iso.split('-').map(Number); return new Date(a,m-1,d); };
const paraISO = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const somaDias = (iso,n) => { const d=novaData(iso); d.setDate(d.getDate()+n); return paraISO(d); };
const dataHora = iso => { if(!iso) return '–'; const [d,h] = iso.split('T'); return dataBR(d)+(h?' às '+h.slice(0,5):''); };
const js = v => esc(JSON.stringify(v));   // argumento seguro dentro de onclick="..."

/* ======================================================================
   3. Dados: recorte e somas
   ====================================================================== */

function limitePeriodo(){
  if(fPeriodo==='hoje') return D.hoje;
  if(fPeriodo==='7') return somaDias(D.hoje,-6);
  if(fPeriodo==='30') return somaDias(D.hoje,-29);
  return null;
}

/* escopo: undefined = filtros da tela; 'semPeriodo' = ignora o período (ritmo de hoje e do mês);
   'historico' = só os arquivos guardados pelo Limpar visão */
function filtrados(escopo){
  const limite = escopo ? null : limitePeriodo();
  const busca = fBusca.trim().toLowerCase();
  return D.envios.filter(e=>{
    if(escopo==='historico' ? !e.arquivado : e.arquivado) return false;
    if(!escopo && fPeriodo==='mes' && e.mes!==D.mesAtual) return false;
    if(limite && e.dataProc<limite) return false;
    if(fAgencia!=='todos' && e.agencia!==fAgencia) return false;
    if(busca && !(e.arquivo.toLowerCase().includes(busca) || e.agencia.toLowerCase().includes(busca))) return false;
    if(fStatus==='ultima' && !e.ultimaExecucao) return false;
    if(fStatus==='critica' && e.faixa!=='critica') return false;
    if(fStatus==='robo' && e.roboOk) return false;
    return true;
  });
}

/* Números de um envio para a companhia escolhida (ou o arquivo inteiro).
   ok=false: o envio não tem o detalhe por companhia. */
function med(e,cia){
  cia = cia || fCia;
  const est = e.estudo, completo = e.estudoCompleto;
  const n = b => b ? b.linhas : null, v = b => b ? b.valor : null;
  let m;
  if(cia==='todas'){
    m = {ok:true, total:e.total, depois:e.aprovados, removidas:e.removidos,
      vBruto: est ? v(est.bruto) : e.valorAprovado+e.valorRemovido,
      vDepois: est ? v(est.depois) : e.valorAprovado, vRemovido: est ? v(est.removidas) : e.valorRemovido};
    if(completo) Object.assign(m,{antes:est.antes.linhas, recuperadas:est.recuperadas.linhas, aceitas:n(est.aceitasForaPadrao)||0,
      vAntes:est.antes.valor, vRecuperado:est.recuperadas.valor, vAceitas:v(est.aceitasForaPadrao)||0});
  }else{
    const pc = est && est.porCia && est.porCia[cia];
    if(!pc) return {ok:false};
    m = {ok:true, total:n(pc.bruto)||0, depois:n(pc.depois)||0, removidas:n(pc.removidas)||0,
      vBruto:v(pc.bruto)||0, vDepois:v(pc.depois)||0, vRemovido:v(pc.removidas)||0};
    if(completo) Object.assign(m,{antes:n(pc.antes), recuperadas:n(pc.recuperadas), aceitas:n(pc.aceitasForaPadrao)||0,
      vAntes:v(pc.antes), vRecuperado:v(pc.recuperadas), vAceitas:v(pc.aceitasForaPadrao)||0});
  }
  if(m.antes===undefined) Object.assign(m,{antes:null,recuperadas:null,aceitas:null,vAntes:null,vRecuperado:null,vAceitas:null});
  // linhas que o usuário escolheu manter com erro sobem, mas continuam sendo erro para o banco
  const bm = cia==='todas' ? est?.mantidas : est?.porCia?.[cia]?.mantidas;
  m.mantidas = bm ? bm.linhas : (cia==='todas' ? (e.mantidas||0) : 0);
  m.vMantidas = bm ? bm.valor : 0;
  m.erroCrua = m.antes===null ? null : pct(m.total-m.antes,m.total);
  m.erroAjustada = pct(m.removidas+m.mantidas,m.total);
  m.vBanco = e.roboOk ? m.vDepois : 0;   // só entra no banco o arquivo que sobe
  return m;
}

function somar(lista,cia){
  const r = {envios:lista.length,total:0,aprovados:0,removidos:0,valorAp:0,valorRm:0,valorBruto:0,valorBanco:0,
    rejeitados:0,empresas:0,agencias:new Set(),dias:new Set(),semCia:0,mais5:0,
    medAntes:0,totalMedido:0,antesAp:0,depoisMedido:0,recuperadas:0,aceitas:0,mantidas:0,mantidasMedidas:0,vMantidas:0,
    vAntes:0,vRecuperado:0,vAceitas:0,vDepoisMedido:0,vBrutoMedido:0,sobemCrua:0,
    saudeSoma:0,saudePeso:0,criticas:0,atencao:0};
  lista.forEach(e=>{
    r.agencias.add(e.agencia); r.dias.add(e.dataProc);
    if(e.rejeitado) r.rejeitados++;
    if(!e.roboOk) r.mais5++;
    if(e.faixa==='critica') r.criticas++;
    if(e.faixa==='atencao') r.atencao++;
    if(e.saude && !vazioN(e.saude.nota)){ const p=Math.max(e.total,1); r.saudeSoma+=e.saude.nota*p; r.saudePeso+=p; }
    r.empresas+=e.empresas;
    const m = med(e,cia);
    if(!m.ok){ r.semCia++; return; }
    r.total+=m.total; r.aprovados+=m.depois; r.removidos+=m.removidas; r.mantidas+=m.mantidas;
    r.valorAp+=m.vDepois||0; r.valorRm+=m.vRemovido||0; r.valorBruto+=m.vBruto||0; r.valorBanco+=m.vBanco||0;
    if(m.antes!==null){
      r.medAntes++; r.totalMedido+=m.total; r.antesAp+=m.antes; r.depoisMedido+=m.depois;
      r.recuperadas+=m.recuperadas; r.aceitas+=m.aceitas; r.mantidasMedidas+=m.mantidas; r.vMantidas+=m.vMantidas;
      r.vAntes+=m.vAntes; r.vRecuperado+=m.vRecuperado; r.vAceitas+=m.vAceitas;
      r.vDepoisMedido+=m.vDepois; r.vBrutoMedido+=m.vBruto;
      if(e.saude?.sobeCrua) r.sobemCrua++;
    }
  });
  r.erroAjustada = pct(r.removidos+r.mantidas,r.total);                        // removidas + mantidas com erro
  r.erroCrua = r.totalMedido ? (r.totalMedido-r.antesAp)/r.totalMedido*100 : null;   // só onde há base crua
  r.erroAjustadaMedida = r.totalMedido ? (r.totalMedido-r.depoisMedido+r.mantidasMedidas)/r.totalMedido*100 : null;
  r.mais5Crua = r.medAntes - r.sobemCrua;
  r.saude = r.saudePeso ? r.saudeSoma/r.saudePeso : null;
  return r;
}

function agrupar(lista,chave){
  const m = new Map();
  lista.forEach(e=>{ const k=chave(e); if(!m.has(k)) m.set(k,[]); m.get(k).push(e); });
  return m;
}
function contarDict(lista,campo){
  const m = new Map();
  lista.forEach(e=>Object.entries((typeof campo==='function'?campo(e):e[campo])||{}).forEach(([k,v])=>m.set(k,(m.get(k)||0)+v)));
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
// envio mais recente de cada agência (o anterior já foi substituído)
function ultimosPorAgencia(lista){ return [...agrupar(lista,e=>e.agencia).values()].map(envs=>envs[envs.length-1]); }

/* para onde foram as linhas: da base crua ao arquivo enviado */
function funil(t){

    ['s-aceita','Aceitas fora do padrão',t.aceitas,t.vAceitas,'O robô aceitou sem corrigir: a correção dessa coluna não foi escolhida'],

/* Situação base crua x ajustada, arquivo a arquivo (% de linhas com erro; à direita do limite não sobe) */
function halteres(lista){
  const itens = lista.map(e=>({e,m:med(e,'todas')})).filter(x=>x.m.ok && x.m.total && !x.e.rejeitado).slice(-14).reverse();
  if(!itens.length) return '<div class="vazio">Sem arquivos no recorte.</div>';
  const vals = itens.flatMap(x=>[x.m.erroCrua,x.m.erroAjustada]).filter(v=>!vazioN(v));
  // escala de 0 a no máximo 25%: um arquivo com 100% de erro não pode espremer os demais perto do zero
  const ESCALA_MAX = 25;
  const max = Math.min(ESCALA_MAX, Math.max(10, Math.ceil(Math.max(...vals,LIM)*1.1/5)*5));
  const pos = v => (Math.min(v,max)/max*100).toFixed(2)+'%';
  const ticks = [0,LIM,...[Math.round(max/2),max].filter(t=>Math.abs(t-LIM)>max*0.08)].sort((a,b)=>a-b);
  const linhas = itens.map(({e,m})=>{
    const a = m.erroCrua, d = m.erroAjustada;
    const temA = !vazioN(a);
    const esq = temA ? Math.min(a,d) : d, dir = temA ? Math.max(a,d) : d;
    return `<button class="hlt-row${e.ultimaExecucao?' flash':''}" data-envio="${esc(e.id)}" aria-label="${esc(e.agencia)}: base crua ${temA?fmtPct(a)+' de erro':'sem medição'}, base ajustada ${fmtPct(d)} de erro">
      <span class="hlt-nm">${esc(e.agencia)}<small>${dataBR(e.dataProc)}</small></span>
      <span class="hlt-tr"><span class="zona" style="left:${pos(LIM)}"></span><span class="base"></span><span class="lim" style="left:${pos(LIM)}"></span>
        ${temA?`<span class="liga" style="left:${pos(esq)};width:calc(${pos(dir)} - ${pos(esq)})"></span><span class="pt a" style="left:${pos(a)}" data-tip="Base crua: ${fmtPct(a)} de erro · ${a<=LIM?'sobe':'não sobe'}"></span>`:''}
        <span class="pt d${d>max?' alem':''}" style="left:${pos(d)}" data-tip="Base ajustada: ${fmtPct(d)} de erro · ${d<=LIM?'sobe':'não sobe'}${d>max?' · fora da escala do gráfico':''}"></span></span>
      <span class="hlt-vl">${temA?`${fmtPct(a)} → `:'<span style="color:var(--muted)">sem crua → </span>'}<b>${fmtPct(d)}</b></span></button>`;
  }).join('');
  return `<div class="hlt">${linhas}</div><div class="hlt-eixo" aria-hidden="true"><div></div><div class="ticks">${ticks.map(t=>`<span style="left:${pos(t)}">${t===max?'≥ ':''}${fmtDec(t,0)}%</span>`).join('')}</div><div></div></div>
    <div class="leg"><span><i class="s-antes" style="border-radius:50%"></i>Base crua</span><span><i class="s-recup" style="border-radius:50%"></i>Base ajustada</span>
    <span><i style="border-left:2px dashed var(--warn);border-radius:0;width:2px"></i>Limite do banco: acima de ${LIM}% de erro não sobe</span></div>`;
}

/* atividade dos últimos 12 meses */
function heatmap(lista){
  if(!lista.length) return '<div class="vazio">Sem atividade no recorte.</div>';
  const porDia = agrupar(lista,e=>e.dataProc);
  const max = Math.max(...[...porDia.values()].map(v=>v.reduce((a,e)=>a+e.total,0)),1);
  const nivel = v => v===0 ? 0 : v/max<=.25 ? 1 : v/max<=.5 ? 2 : v/max<=.75 ? 3 : 4;
  const cores = ['var(--hm0)','color-mix(in srgb,var(--laranja) 30%,transparent)','color-mix(in srgb,var(--laranja) 55%,transparent)','color-mix(in srgb,var(--laranja) 78%,transparent)','var(--laranja)'];
  const hoje = novaData(D.hoje);
  const domingoAtual = new Date(hoje); domingoAtual.setDate(hoje.getDate() - hoje.getDay());
  const inicio = new Date(domingoAtual); inicio.setDate(domingoAtual.getDate() - 52*7);
  const fim = new Date(domingoAtual); fim.setDate(domingoAtual.getDate() + 6);
  const totalSemanas = Math.round((fim - inicio) / (7*86400000));
  const celulas = [], rotulos = [];
  let cursor = new Date(inicio), coluna = 0;
  while(cursor <= fim){
    const iso = paraISO(cursor), dow = cursor.getDay();
    if(cursor.getDate() === 1) rotulos.push(`<span style="left:${coluna*14}px;">${MESES_CURTO[cursor.getMonth()]}</span>`);
    if(iso > D.hoje){
      celulas.push(`<div class="hm-cel futuro" style="grid-column:${coluna+1};grid-row:${dow+1};"></div>`);
    } else {
      const envs = porDia.get(iso)||[];
      const tot = envs.reduce((a,e)=>a+e.total,0);
      const titulo = envs.length ? `${dataExtenso(iso)}: ${fmtInt(tot)} linhas em ${fmtInt(envs.length)} arquivo(s)` : `${dataExtenso(iso)}: sem tratamento`;
      celulas.push(`<div class="hm-cel ${iso===D.hoje?'hoje':''}" style="grid-column:${coluna+1};grid-row:${dow+1};background:${cores[nivel(tot)]};" data-tip="${esc(titulo)}"></div>`);
    }
    if(dow===6) coluna++;
    cursor.setDate(cursor.getDate()+1);
  }
  return `<div class="hm-grafico"><div class="hm-inner">
      <div class="hm-cab" style="width:${totalSemanas*14}px;">${rotulos.join('')}</div>
      <div class="hm-corpo"><div class="hm-dow"><span></span><span>Seg</span><span></span><span>Qua</span><span></span><span>Sex</span><span></span></div>
        <div class="hm-grid" style="grid-template-columns:repeat(${totalSemanas},11px);">${celulas.join('')}</div></div>
    </div></div>
    <div class="escala">Menos ${cores.map(c=>`<i style="background:${c}"></i>`).join('')} Mais · Pico de ${fmtInt(max)} linhas em um dia</div>`;
}

/* tabela "Resultado de cada arquivo" (também usada na aba Mensagem à agência) */
function cabecalhoTratamento(){
  return '<th class="metric-col">Situação</th><th class="metric-col">Situação Base Crua</th><th class="metric-col">Situação Base Ajustada</th>'+
    '<th class="metric-col">Linhas recuperadas</th><th class="metric-col">Valor recuperado</th>';
}
function celulasTratamento(e){
  const m = med(e,'todas'), s = e.saude||{};
  if(e.rejeitado) return `<td>${chipFaixa(e.faixa,s.motivo)}</td><td colspan="4"><span class="metric-missing">${esc(e.motivo||'Arquivo rejeitado por formato')}</span></td>`;
  return `<td>${chipFaixa(e.faixa,s.motivo)}</td><td>${situacao(m.erroCrua,s.sobeCrua)}</td><td>${situacao(m.erroAjustada,s.sobeAjustada)}</td>`+
    `<td>${m.recuperadas===null?'<span class="metric-missing">–</span>':fmtInt(m.recuperadas)}</td><td>${m.vRecuperado===null?'<span class="metric-missing">–</span>':brl(m.vRecuperado)}</td>`;
}
function tabelaTratamento(lista,titulo='Resultado de cada arquivo'){
  if(!lista.length) return '';
  let h = `${secao(titulo)}<div class="box"><div class="scr"><table class="tb metrics-table"><thead><tr><th>Arquivo</th><th>Agência</th>${cabecalhoTratamento()}<th>Tratado em</th></tr></thead><tbody>`;
  for(const e of lista.slice().reverse()){
    h += `<tr ${attrEnvio(e)}><td>${esc(e.arquivo)}${badges(e)}</td><td>${esc(e.agencia)}</td>${celulasTratamento(e)}<td>${dataBR(e.dataProc)}</td></tr>`;
  }
  return h+'</tbody></table></div></div>';
}

function kpisSituacao(t){
  const crua = t.erroCrua===null
    ? tile('Situação Base Crua','–','Nenhum arquivo do recorte tem a base crua guardada')
    : tile('Situação Base Crua',`${fmtPct(t.erroCrua)}<small> de erro</small>`,
        `${chipSobe(t.erroCrua<=LIM)} ${fmtInt(t.sobemCrua)} de ${fmtInt(t.medAntes)} arquivos subiriam como chegaram`,'',t.erroCrua>LIM?'warn':'ok',
        `data-tip="Linhas que chegaram com algum erro, sobre o total de linhas dos arquivos com base crua guardada. Acima de ${LIM}% o banco nega o arquivo."`);
  const ajustada = tile('Situação Base Ajustada',`${fmtPct(t.erroAjustada)}<small> de erro</small>`,
    `${chipSobe(t.erroAjustada<=LIM)} ${fmtInt(t.envios-t.mais5)} de ${fmtInt(t.envios)} arquivos sobem`,'',t.erroAjustada>LIM?'warn':'ok',
    `data-tip="Linhas que ficaram de fora depois do tratamento, sobre o total de linhas do recorte."`);
  const mais5 = tile('Arquivos com +5% de Erros',`${fmtInt(t.mais5)}<small> de ${fmtInt(t.envios)}</small>`,
    t.medAntes?`Depois do tratamento · na base crua eram ${fmtInt(t.mais5Crua)} de ${fmtInt(t.medAntes)}`:'Depois do tratamento','',t.mais5?'warn':'ok');
  return `<div class="grid g3 summary-kpis">${crua}${ajustada}${mais5}</div>`;
}

function blocoRecentes(lista){
  const rec = lista.filter(e=>e.ultimaExecucao);
  if(!rec.length) return '';
  const ult = D.ultimaExecucao||{};
  return secao('Tratados na última execução',`${dataHora(ult.quando)}${ult.usuario?' · '+esc(ult.usuario):''}`)+
    `<div class="recentes">${rec.map(e=>{const m=med(e,'todas'), s=e.saude||{};
      return `<button class="rec-card flash" data-envio="${esc(e.id)}"><div class="n">${anel(s.nota,52,e.faixa)}<div><div class="t">${esc(e.agencia)}</div><div class="s">${esc(e.arquivo)}</div></div></div>
      <div class="rec-sit"><span>Base crua</span>${situacao(m.erroCrua,s.sobeCrua)}</div>
      <div class="rec-sit"><span>Base ajustada</span>${situacao(m.erroAjustada,s.sobeAjustada)}</div>
      <div class="s">${fmtInt(e.total)} linhas · ${brl(m.vDepois)} aprovados</div>${badges(e)}</button>`;}).join('')}</div>`;
}

// o que precisa de ação: só o envio mais recente de cada agência, do mais grave para o mais leve
function blocoAtencao(lista){
  const peso = {critica:0,atencao:1};
  const itens = ultimosPorAgencia(lista).filter(e=>e.faixa==='critica'||e.faixa==='atencao')
    .sort((a,b)=>peso[a.faixa]-peso[b.faixa] || b.dataProc.localeCompare(a.dataProc));
  if(!itens.length) return `<div class="aviso ok">Nenhuma agência precisa de atenção no envio mais recente.</div>`;

    <span class="ia-motivo">${esc(e.saude?.motivo||'')}</span></button>`).join('')}</div>`;
}

/* Filtros próprios da aba Vendas: cupom, código da companhia (CAMPO_04) e CAMPO_10 (I ou N).
   Fonte: linhas aprovadas das bases tratadas (Sunny Clouds) e linhas que ficaram de fora (Removed). */
let vCupom = 'todos', vCodigo = 'todas', vTipo = 'todos';
const NOME_TIPO = {I:'I · Internacional', N:'N · Nacional', 'sem tipo':'Sem tipo (vazio ou inválido)'};
function grupoDoCodigo(c){ for(const [g,cs] of Object.entries(D.gruposCia||{})) if(cs.includes(c)) return g; return 'OUTRAS'; }

const ehCodigoG = c => /^G\d{3,}$/.test(c||'');
function passaCodigo(c,orig){
  const g = grupoDoCodigo(c);
  if(fCia!=='todas' && g!==fCia) return false;
  if(vCodigo==='todas') return true;
  if(ehCodigoG(vCodigo)) return orig===vCodigo;
  return D.ordemCia.includes(vCodigo) ? g===vCodigo : c===vCodigo;
}
// ignorar: 'cupom' ou 'tipo' deixa esse filtro de fora (para montar a lista de opções dele)
function linhasVenda(e,tipo,ignorar){ return (e.vendas?.[tipo]||[]).filter(([c,cp,,,tp,orig])=>passaCodigo(c,orig)
  && (ignorar==='cupom'||vCupom==='todos'||cp===vCupom) && (ignorar==='tipo'||vTipo==='todos'||(tp||'sem tipo')===vTipo)); }
function somaVendas(lista,tipo,chave,ignorar){   // chave: 0 = código, 1 = cupom, 4 = CAMPO_10
  const m = new Map();
  lista.forEach(e=>linhasVenda(e,tipo,ignorar).forEach(r=>{ r = chave===4 && !r[4] ? [...r.slice(0,4),'sem tipo'] : r; const a=m.get(r[chave])||{linhas:0,valor:0}; a.linhas+=r[2]; a.valor+=r[3]; m.set(r[chave],a); }));
  return m;
}
const somaMapa = m => [...m.values()].reduce((a,b)=>({linhas:a.linhas+b.linhas,valor:a.valor+b.valor}),{linhas:0,valor:0});
function setVendas(qual,valor){ if(qual==='cupom') vCupom=valor; else if(qual==='tipo') vTipo=valor; else vCodigo=valor; render(); }

function viewVendas(){
  const lista = filtrados();
  if(!lista.length) return vazioFiltro();
  const comDet = lista.filter(e=>e.vendas), semDet = lista.filter(e=>!e.vendas);
  const filtroLocal = vCupom!=='todos' || vCodigo!=='todas' || vTipo!=='todos';
  const ap = somaVendas(comDet,'ap',0), rm = somaVendas(comDet,'rm',0);
  const porGrupo = Object.fromEntries(D.ordemCia.map(g=>[g,{linhas:0,valor:0}]));
  ap.forEach((v,c)=>{ const g=porGrupo[grupoDoCodigo(c)]; g.linhas+=v.linhas; g.valor+=v.valor; });
  // sem detalhe (arquivos sem bases tratadas) só entra sem filtro de cupom/código: não dá para separar
  const vSem = (!filtroLocal && fCia==='todas') ? semDet.reduce((a,e)=>a+med(e,'todas').vDepois,0) : 0;
  const totAp = somaMapa(ap).valor + vSem;
  const totBanco = comDet.filter(e=>e.roboOk).reduce((a,e)=>a+linhasVenda(e,'ap').reduce((x,r)=>x+r[3],0),0)
    + (vSem ? semDet.filter(e=>e.roboOk).reduce((a,e)=>a+med(e,'todas').vDepois,0) : 0);
  const totFora = somaMapa(rm).valor + ((!filtroLocal && fCia==='todas') ? semDet.reduce((a,e)=>a+(med(e,'todas').vRemovido||0),0) : 0);

  // ---- filtros da aba
  const cupons = [...somaVendas(comDet,'ap',1,'cupom').entries()].sort((a,b)=>(parseInt(a[0])||999)-(parseInt(b[0])||999));
  const tipos = [...somaVendas(comDet,'ap',4,'tipo').entries()].sort((a,b)=>b[1].valor-a[1].valor);
  const todosCodigos = new Map(); comDet.forEach(e=>(e.vendas.ap||[]).forEach(([c,,n,v])=>{ const a=todosCodigos.get(c)||{linhas:0,valor:0}; a.linhas+=n; a.valor+=v; todosCodigos.set(c,a); }));
  // códigos G que chegaram nos arquivos, agrupados pela sigla para a qual o de-para os traduziu
  const codigosG = new Map(); comDet.forEach(e=>['ap','rm'].forEach(t=>(e.vendas[t]||[]).forEach(([c,,n,v,,o])=>{ if(!o) return;
    const a=codigosG.get(o)||{para:c,linhas:0,valor:0,fora:0}; if(t==='ap'){a.linhas+=n;a.valor+=v;} else a.fora+=v; codigosG.set(o,a); })));
  const gsDe = c => [...codigosG.entries()].filter(([,x])=>x.para===c).sort((a,b)=>b[1].valor-a[1].valor);
  const nomeCodigo = c => ehCodigoG(c) ? `${c} → ${codigosG.get(c)?.para||'?'}` : (NOMES_CIA[c]||c);
  const opcoesCodigo = D.ordemCia.map(g=>{
    const cs = [...todosCodigos.entries()].filter(([c])=>grupoDoCodigo(c)===g).sort((a,b)=>b[1].valor-a[1].valor);
    return `<optgroup label="${esc(NOMES_CIA[g])} · ${cs.length} código(s)"><option value="${g}"${vCodigo===g?' selected':''}>${esc(NOMES_CIA[g])} (todos os códigos)</option>${cs.map(([c,v])=>`<option value="${esc(c)}"${vCodigo===c?' selected':''}>${esc(c)} · ${fmtInt(v.linhas)} linhas</option>`
      + gsDe(c).map(([o,x])=>`<option value="${esc(o)}"${vCodigo===o?' selected':''}>&nbsp;&nbsp;&nbsp;${esc(o)} → ${esc(c)} · ${x.linhas?`${fmtInt(x.linhas)} linha${x.linhas===1?'':'s'}`:'nenhuma aprovada, só nas que ficaram de fora'}</option>`).join('')).join('')}</optgroup>`;
  }).join('');
  let h = `<div class="box filtros-vendas"><div class="f-campo"><label for="vCupom">Cupom</label><select id="vCupom" onchange="setVendas('cupom',this.value)">
      <option value="todos">Todos os cupons</option>${cupons.map(([cp,v])=>`<option value="${esc(cp)}"${vCupom===cp?' selected':''}>${cp==='sem cupom'?'Sem cupom':'Cupom '+esc(cp)} · ${fmtInt(v.linhas)} linhas</option>`).join('')}</select></div>
    <div class="f-campo"><label for="vCodigo">Companhia</label><select id="vCodigo" onchange="setVendas('codigo',this.value)"><option value="todas">Todas as companhias</option>${opcoesCodigo}</select></div>
    <div class="f-campo"><label for="vTipo">Tipo</label><select id="vTipo" onchange="setVendas('tipo',this.value)">
      <option value="todos">Todos os tipos (I e N)</option>${tipos.map(([tp,v])=>`<option value="${esc(tp)}"${vTipo===tp?' selected':''}>${esc(NOME_TIPO[tp]||tp)} · ${fmtInt(v.linhas)} linhas</option>`).join('')}</select></div>
    ${filtroLocal?`<button class="btn-limpar" onclick="vCupom='todos';vCodigo='todas';vTipo='todos';render()">Limpar cupom, companhia e tipo</button>`:''}
    <p class="notinha">Fonte: linhas aprovadas das bases tratadas (Sunny Clouds) e linhas que ficaram de fora (Removed), pelo código em CAMPO_04. Códigos internos G+números aparecem no filtro abaixo da sigla IATA para a qual são convertidos pelo de-para ${esc(D.dePara?.arquivo||'(arquivo não encontrado)')} (${fmtInt(D.dePara?.codigos||0)} códigos).${semDet.length?` ${fmtInt(semDet.length)} arquivo(s) antigo(s) sem essas bases (${esc(semDet.map(e=>e.agencia).join(', '))}) entram só em "Sem detalhe" e não podem ser filtrados por cupom, companhia ou tipo.`:''}</p></div>`;

  // ---- cartões por grupo
  h += `<div class="grid ${vSem?'g5':'g4'} summary-kpis">`+D.ordemCia.map(g=>{const v=porGrupo[g];
    return `<button class="tile clicavel${fCia===g?' sel':''}" onclick="setFiltro('cia','${fCia===g?'todas':g}')" aria-pressed="${fCia===g}" data-tip="Clique para filtrar o painel inteiro por ${esc(NOMES_CIA[g])}">
      <div class="cia-card"><div class="nome"><i class="c-${g.toLowerCase()}"></i>${NOMES_CIA[g]} <span style="color:var(--muted);font-weight:500">${CODIGOS_CIA[g]}</span></div>
      <div class="vl">${brl(v.valor)}</div><div class="mini"><span>${fmtPct(pct(v.valor,totAp))} das vendas</span><span>${fmtInt(v.linhas)} linhas</span></div></div></button>`;}).join('')+
    (vSem?`<div class="tile" data-tip="Arquivos antigos cujas bases não estão mais na pasta"><div class="cia-card"><div class="nome"><i class="c-sem"></i>Sem detalhe por companhia</div>
      <div class="vl">${brl(vSem)}</div><div class="mini"><span>${fmtPct(pct(vSem,totAp))} das vendas</span><span>${esc(semDet.map(e=>e.agencia).join(', '))}</span></div></div></div>`:'')+'</div>';

  const recorte = [vCupom!=='todos'?(vCupom==='sem cupom'?'sem cupom':'cupom '+vCupom):'', vCodigo!=='todas'?nomeCodigo(vCodigo):'', vTipo!=='todos'?'tipo '+(NOME_TIPO[vTipo]||vTipo):'', fCia!=='todas'?NOMES_CIA[fCia]:''].filter(Boolean).join(' · ');
  h += secao(recorte?`Recorte: ${recorte}`:'Participação de cada companhia');
  const itensPilha = [...D.ordemCia.map(g=>({cia:g,valor:porGrupo[g].valor,linhas:porGrupo[g].linhas})), ...(vSem?[{cia:'SEM',valor:vSem,linhas:semDet.reduce((a,e)=>a+e.aprovados,0)}]:[])];
  h += `<div class="box"><div class="grid g3" style="margin-bottom:18px">${tile('Vendas aprovadas',brl(totAp),'Linhas aprovadas pelo tratamento')}${tile('Entram no banco',brl(totBanco),`Só dos arquivos que sobem, com até ${LIM}% de erro`)}${tile('Vendas que ficaram de fora',brl(totFora),'Linhas removidas pelo tratamento','',totFora?'warn':'')}</div>
    ${pilhaCia(itensPilha,true)}${legendaCia(itensPilha)}</div>`;

  // ---- códigos dentro do grupo escolhido (padrão: Outras)
  const grupoVer = D.ordemCia.includes(vCodigo) ? vCodigo : ehCodigoG(vCodigo) ? grupoDoCodigo(codigosG.get(vCodigo)?.para) : vCodigo!=='todas' ? grupoDoCodigo(vCodigo) : (fCia!=='todas'?fCia:'OUTRAS');
  const daqui = [...ap.entries()].filter(([c])=>grupoDoCodigo(c)===grupoVer).sort((a,b)=>b[1].valor-a[1].valor);
  const totGrupo = daqui.reduce((a,[,v])=>a+v.valor,0);
  h += secao(`Companhias dentro de ${NOMES_CIA[grupoVer]}`, `${fmtInt(daqui.length)} código(s) · clique para filtrar`);
  h += daqui.length ? `<div class="box"><div class="scr" style="max-height:460px"><table class="tb metrics-table"><thead><tr><th>Código</th><th>Linhas aprovadas</th><th>Vendas aprovadas</th><th>% de ${esc(NOMES_CIA[grupoVer])}</th><th>Ficou de fora</th><th style="text-align:left;">Códigos G no arquivo</th></tr></thead><tbody>${daqui.map(([c,v])=>
      `<tr class="clicavel${vCodigo===c?' destaque':''}" tabindex="0" onclick="setVendas('codigo',${js(vCodigo===c?'todas':c)})" onkeydown="if(event.key==='Enter')this.click()"><td><span class="nm-cia"><i class="c-${grupoVer.toLowerCase()}"></i>${esc(c)}</span></td><td>${fmtInt(v.linhas)}</td><td class="pos">${brl(v.valor)}</td><td>${fmtPct(pct(v.valor,totGrupo))}</td><td>${brl(rm.get(c)?.valor||0)}</td><td class="txt">${gsDe(c).map(([o,x])=>`<button class="btn-limpar" onclick="event.stopPropagation();setVendas('codigo',${js(vCodigo===o?'todas':o)})" data-tip="Código interno do arquivo; o de-para leva para ${esc(c)}">${esc(o)} → ${esc(c)} · ${fmtInt(x.linhas)}</button>`).join(' ')||'<span style="color:var(--text2)">–</span>'}</td></tr>`).join('')}</tbody></table></div></div>`
    : '<div class="vazio">Nenhuma venda aprovada neste recorte.</div>';

  // ---- vendas por cupom (com o filtro de companhia, todos os cupons)
  // ---- vendas por CAMPO_10 (I/N), com os outros filtros
  const totTipo = tipos.reduce((a,[,v])=>a+v.valor,0);
  h += secao('Vendas por tipo (coluna CAMPO_10)', 'I = internacional · N = nacional · clique para filtrar');
  h += tipos.length ? `<div class="box"><table class="tb metrics-table"><thead><tr><th>Tipo</th><th>Linhas aprovadas</th><th>Vendas aprovadas</th><th>% das vendas</th></tr></thead><tbody>${tipos.map(([tp,v])=>
      `<tr class="clicavel${vTipo===tp?' destaque':''}" tabindex="0" onclick="setVendas('tipo',${js(vTipo===tp?'todos':tp)})" onkeydown="if(event.key==='Enter')this.click()"><td>${esc(NOME_TIPO[tp]||tp)}</td><td>${fmtInt(v.linhas)}</td><td class="pos">${brl(v.valor)}</td><td>${fmtPct(pct(v.valor,totTipo))}</td></tr>`).join('')}</tbody></table></div>` : '';

  const porCupom = [...somaVendas(comDet,'ap',1,'cupom').entries()].sort((a,b)=>(parseInt(a[0])||999)-(parseInt(b[0])||999));
  const totCupom = porCupom.reduce((a,[,v])=>a+v.valor,0);
  h += secao('Vendas por cupom', vCodigo!=='todas'||fCia!=='todas' ? `Companhia: ${esc(vCodigo!=='todas'?nomeCodigo(vCodigo):NOMES_CIA[fCia])} · clique para filtrar` : 'Todas as companhias · clique para filtrar');
  h += porCupom.length ? `<div class="box"><table class="tb metrics-table"><thead><tr><th>Cupom</th><th>Linhas aprovadas</th><th>Vendas aprovadas</th><th>% das vendas</th></tr></thead><tbody>${porCupom.map(([cp,v])=>

  // ---- por agência, já com os filtros
  const itens = ordenarAgencias(resumoAgencias(lista));
  h += secao('Vendas por agência e companhia','Clique em uma agência para ver o detalhe');
  h += '<div class="box"><div class="scr"><table class="tb metrics-table"><thead><tr>' +
    `<th>Agência</th>${D.ordemCia.map(c=>`<th><span class="nm-cia"><i class="c-${c.toLowerCase()}"></i>${NOMES_CIA[c]}</span></th>`).join('')}<th>Total aprovado</th><th>Ficou de fora</th><th>Arquivos</th><th>Empresas</th></tr></thead><tbody>`;
  itens.forEach(r=>{
    const det = r.envs.filter(e=>e.vendas);
    const g = Object.fromEntries(D.ordemCia.map(x=>[x,0])); let fora = 0;
    det.forEach(e=>{ linhasVenda(e,'ap').forEach(([c,,,v])=>g[grupoDoCodigo(c)]+=v); linhasVenda(e,'rm').forEach(([,,,v])=>fora+=v); });
    const semAg = (!filtroLocal && fCia==='todas') ? r.envs.filter(e=>!e.vendas) : [];
    const total = D.ordemCia.reduce((a,x)=>a+g[x],0) + semAg.reduce((a,e)=>a+med(e,'todas').vDepois,0);
    fora += semAg.reduce((a,e)=>a+(med(e,'todas').vRemovido||0),0);
    if(filtroLocal && !total && !fora) return;
    h += `<tr class="clicavel" tabindex="0" data-agencia="${esc(r.ag)}"><td>${esc(r.ag)}</td>
      ${D.ordemCia.map(x=>`<td>${det.length?brl(g[x]):'<span class="metric-missing" data-tip="Arquivo antigo sem detalhe por companhia">–</span>'}</td>`).join('')}<td class="pos">${brl(total)}</td><td>${brl(fora)}</td>
      <td>${fmtInt(r.s.envios)}</td><td>${fmtInt(r.s.empresas)}</td></tr>`;
  });
  return h + '</tbody></table></div></div>';
}

function resumoAgencias(lista){
  return [...agrupar(lista,e=>e.agencia).entries()].map(([ag,envs])=>{
    const ult = envs[envs.length-1], ant = envs.length>1 ? envs[envs.length-2] : null;
    const tend = ant && !vazioN(ult.saude?.nota) && !vazioN(ant.saude?.nota) ? ult.saude.nota-ant.saude.nota : null;
    return {ag,envs,ult,s:somar(envs),tend,cia:valoresCia(envs)};
  });
}
function ordenarAgencias(itens){
  const pesoFaixa = {saudavel:3,atencao:2,critica:1,sem:0};
  const k = {saude:r=>(pesoFaixa[r.ult.faixa]||0)*1000+(r.ult.saude?.nota??0), valor:r=>r.s.valorAp,
    erro:r=>-(r.ult.saude?.erroAjustada??100), volume:r=>r.s.total}[ordemAgencias];
  return itens.sort((a,b)=>k(b)-k(a));
}
function cartoesAgencias(lista){
  const itens = ordenarAgencias(resumoAgencias(lista));
  if(!itens.length) return '<div class="vazio">Nenhuma agência no recorte.</div>';
  return `<div class="rk-grid">${itens.map((r,i)=>{
    const s = r.ult.saude||{}, m = med(r.ult,'todas');
    const tend = r.tend===null ? '' : Math.abs(r.tend)<0.5 ? '<span class="pp zero">estável</span>' : `<span class="pp ${r.tend>0?'up':'down'}">${r.tend>0?'▲ melhorou':'▼ piorou'} desde o envio anterior</span>`;
    return `<button class="ag-card${r.envs.some(e=>e.ultimaExecucao)?' flash':''}" data-agencia="${esc(r.ag)}">
      <div class="ag-topo"><span class="ag-pos">${String(i+1).padStart(2,'0')}</span>${anel(s.nota,58,r.ult.faixa)}
        <div><div class="ag-nome">${esc(r.ag)}</div><div class="ag-sub">${chipFaixa(r.ult.faixa,s.motivo)} ${tend}</div></div></div>
      <div class="ag-num"><div><span>Base crua</span><b>${situacao(m.erroCrua,s.sobeCrua)}</b></div>
        <div><span>Base ajustada</span><b>${situacao(m.erroAjustada,s.sobeAjustada)}</b></div>
        <div><span>Vendas aprovadas</span><b>${brl(r.s.valorAp)}</b></div>
        <div><span>Arquivos</span><b>${fmtInt(r.s.envios)} · último ${dataBR(r.ult.dataProc)}</b></div></div>
      ${pilhaCia(r.cia)}</button>`;}).join('')}</div>
    <p class="notinha">A nota no círculo vai de 0 a 100: 100 menos a média da % de erro da base crua e da ajustada do envio mais recente.</p>`;
}

    h += `<div class="dr-sec"><h3>Da base crua ao envio</h3><div class="box">${comp?funil(t):`

      <table class="funil-tb"><thead><tr><th>Etapa</th><th>Linhas</th><th>% das linhas</th><th>Valor</th></tr></thead><tbody>

   7. Servidor local e aba Tratar bases
   ====================================================================== */

const API = {base:null, conectado:false, status:null};
const TR = {sel:new Set(), foco:null, previas:{}, resp:{}, simul:{}, carregando:{}, erro:{}, timer:null};
const PORTAS = [8765,8766,8767,8768,8769,8770];

async function conectar(){
  if(D.demo){ API.conectado=false; API.status=null; return false; }   // demonstração publicada: nunca procura servidor local
  const candidatos = location.protocol.startsWith('http') ? [location.origin] : PORTAS.map(p=>`http://127.0.0.1:${p}`);
  for(const base of candidatos){
    try{
      const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(),1500);
      const r = await fetch(base+'/api/status',{cache:'no-store',signal:ctl.signal}); clearTimeout(tm);
      const j = await r.json();
      if(j.app==='manual-das-agencias'){ API.base=base; API.conectado=true; API.status=j; return true; }
    }catch(_){}
  }
  API.conectado=false; API.status=null; return false;
}
async function api(rota,dados){
  const opt = dados===undefined ? {cache:'no-store'} : {method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(dados)};
  const r = await fetch(API.base+rota,opt);
  const j = await r.json().catch(()=>({erro:'Resposta inválida do servidor'}));
  if(!r.ok) throw new Error(j.erro||'Falha na comunicação com o servidor');
  return j;
}
async function atualizarStatus(){
  const ok = API.base ? await api('/api/status').then(j=>{API.status=j;API.conectado=true;return true;}).catch(()=>conectar()) : await conectar();
  pintarServidor();
  if(ok && API.status.job?.estado==='rodando' && !TR.timer) acompanharJob();
  return ok;
}
/* atualização automática: o servidor regera o painel quando alguém trata uma base
   (pelo painel ou pelo terminal, em qualquer computador) e a página se recarrega sozinha */
let recarregarPendente = false;
function podeRecarregar(){
  const ocupado = API.status?.job?.estado==='rodando' || TR.sel.size>0 || !document.getElementById('drawer').hidden
    || (document.activeElement && document.activeElement.matches('input,textarea,select'));
  return !ocupado;
}
async function vigiarAtualizacoes(){
  if(D.demo) return;
  await atualizarStatus().catch(()=>{});
  const novo = API.status?.painelId;
  if(novo && D.geradoId && novo!==D.geradoId){
    if(podeRecarregar()){ try{ sessionStorage.setItem('agencias-auto','1'); }catch(_){} location.reload(); return; }
    if(!recarregarPendente){ recarregarPendente=true; aviso('Há dados novos no painel: ele se atualiza assim que você terminar o que está fazendo.'); }
  }
}
function pintarServidor(){
  const el = document.getElementById('srvStatus');
  el.className = 'srv'+(API.conectado?' on':'');
  el.querySelector('span').textContent = D.demo ? 'Versão de demonstração' : API.conectado ? 'Servidor conectado' : 'Somente leitura (servidor desligado)';
